<style>
  :root{
    --ink: rgba(236,242,255,.92);
    --dim: rgba(233,240,255,.68);
    --faint: rgba(233,240,255,.30);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;background:#000;
    overflow:hidden;overscroll-behavior:none;
    /* the browser must not claim pan, pinch or double-tap: the canvas
       handles all of them, and letting the page zoom scaled the interface
       along with the planet */
    touch-action:none;-ms-touch-action:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  body{
    font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    position:fixed;inset:0;width:100%;
    -webkit-tap-highlight-color:transparent;
  }
  canvas#gl{
    position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  canvas#gl.dragging{cursor:grabbing}

  #hud{position:fixed;inset:0;pointer-events:none;transition:opacity 1.2s ease;opacity:1;
    text-shadow:0 1px 4px rgba(0,0,8,.85), 0 0 14px rgba(0,0,8,.55)}
  #hud.hidden{opacity:0 !important}
  /* a hidden interface must not keep swallowing clicks */
  #hud.hidden, #hud.hidden *{pointer-events:none !important}

  .corner{position:absolute;padding:22px 26px}
  .bl{left:0;bottom:0}
  .tl{left:0;top:0}
  .tr{right:0;top:0;text-align:right}

  .title{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--ink);font-weight:500;
  }
  .sub{
    margin-top:6px;font-size:11px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;font-weight:400;
  }

  .clockrow{display:flex;align-items:center;gap:14px}
  .clock{font-size:26px;font-weight:200;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
  #playpause{
    pointer-events:auto;flex:0 0 34px;width:34px;height:34px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--faint);border-radius:50%;
    color:var(--ink);cursor:pointer;transition:.25s;
  }
  #playpause:hover{border-color:rgba(233,240,255,.60);background:rgba(233,240,255,.10)}
  #playpause svg{width:12px;height:12px;display:block}
  .clocklabel{margin-top:8px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  .bars{margin-top:16px;display:flex;gap:9px;align-items:flex-end}
  .bar{width:46px}
  .bar .track{height:2px;background:var(--faint);position:relative;overflow:hidden}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;transition:width .8s ease}
  .bar .lab{margin-top:6px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .bar .val{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:5px}
  .scales{margin-top:15px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(233,240,255,.56);font-variant-numeric:tabular-nums;line-height:1.85}

  .speeds{pointer-events:auto;display:flex;gap:2px;justify-content:flex-end}
  .sp{
    font:inherit;font-size:10.5px;letter-spacing:.1em;color:var(--dim);
    background:transparent;border:1px solid var(--faint);border-left-width:0;
    padding:6px 11px;cursor:pointer;transition:.25s;
  }
  .sp:first-child{border-left-width:1px}
  .sp:hover{color:var(--ink);border-color:rgba(233,240,255,.38)}
  .sp.on{color:#0a0d14;background:rgba(233,240,255,.86);border-color:rgba(233,240,255,.86)}

  #splash{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#000;z-index:10;transition:opacity 1.6s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}
  #splash .t{font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:var(--dim)}
  #splash .d{width:120px;height:1px;background:var(--faint);position:relative;overflow:hidden}
  #splash .d::after{content:"";position:absolute;inset:0;background:var(--ink);
    animation:sweep 1.4s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  @media (max-width: 620px), (max-height: 520px){
    .corner{padding:15px 17px}
    .title{font-size:10px;letter-spacing:.32em}
    .sub{font-size:9.5px;margin-top:5px}
    .clock{font-size:21px}
    .clockrow{gap:11px}
    #playpause{flex:0 0 30px;width:30px;height:30px}
    .clocklabel{font-size:9.5px;letter-spacing:.13em;margin-top:6px}
    .bars{gap:6px;margin-top:12px}
    .bar{width:44px}
    .bar .lab{font-size:8.5px;letter-spacing:.05em}
    .bar .val{font-size:10px}
    .scales{font-size:9.5px;letter-spacing:.09em;margin-top:12px;line-height:1.75}
    .sp{padding:7px 12px;font-size:11px}
  }

  #fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:40px;font-size:14px;line-height:1.7;color:var(--dim);z-index:20}
</style>

<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="corner tl">
    <div class="title">Aetheris</div>
    <div class="sub">world simulation</div>
  </div>

  <div class="corner tr">
    <div class="speeds">
      <button class="sp on" data-s="1">&times;1</button>
      <button class="sp" data-s="20">&times;20</button>
      <button class="sp" data-s="100">&times;100</button>
    </div>
  </div>

  <div class="corner bl">
    <div class="clockrow">
      <button id="playpause" type="button" aria-label="pause" title="pause"></button>
      <div class="clock" id="clock">0:00:00</div>
    </div>
    <div class="clocklabel" id="clocklabel">elapsed</div>
    <div class="bars" id="bars"></div>
    <div class="scales" id="scales">
      <div id="sc1"></div><div id="sc2"></div><div id="sc3"></div>
    </div>
  </div>
</div>

<div id="splash"><div class="t">forming world</div><div class="d"></div></div>
<div id="fail">This world needs WebGL2, which this browser isn&rsquo;t providing.<br>Try a recent Chrome, Edge, Firefox or Safari with hardware acceleration enabled.</div>

<script>
"use strict";
(function(){

/* ══════════════════════════════════════════════════════════════════════
   0.  small math library
   ══════════════════════════════════════════════════════════════════════ */
const M4 = () => new Float32Array(16);
function perspective(o,fovy,asp,n,f){
  const t=1/Math.tan(fovy/2), nf=1/(n-f);
  o[0]=t/asp;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=t;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(f+n)*nf;o[11]=-1;
  o[12]=0;o[13]=0;o[14]=2*f*n*nf;o[15]=0;return o;
}
function lookAt(o,e,c,u){
  let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];
  let l=1/Math.hypot(zx,zy,zz); zx*=l;zy*=l;zz*=l;
  let xx=u[1]*zz-u[2]*zy, xy=u[2]*zx-u[0]*zz, xz=u[0]*zy-u[1]*zx;
  l=Math.hypot(xx,xy,xz); if(l===0){xx=1;xy=0;xz=0;} else {l=1/l;xx*=l;xy*=l;xz*=l;}
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);
  o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);
  o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);
  o[15]=1;return o;
}
function mul(o,a,b){
  for(let c=0;c<4;c++){
    const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4  ]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  } return o;
}
function invert(o,m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!d) return o; d=1/d;
  o[0]=(a11*b11-a12*b10+a13*b09)*d; o[1]=(a02*b10-a01*b11-a03*b09)*d;
  o[2]=(a31*b05-a32*b04+a33*b03)*d; o[3]=(a22*b04-a21*b05-a23*b03)*d;
  o[4]=(a12*b08-a10*b11-a13*b07)*d; o[5]=(a00*b11-a02*b08+a03*b07)*d;
  o[6]=(a32*b02-a30*b05-a33*b01)*d; o[7]=(a20*b05-a22*b02+a23*b01)*d;
  o[8]=(a10*b10-a11*b08+a13*b06)*d; o[9]=(a01*b08-a00*b10-a03*b06)*d;
  o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;
  o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;
  return o;
}
/* rotation matrix (3x3, column-major in a 9-array) about unit axis */
function axisRot(out,ax,ay,az,ang){
  const c=Math.cos(ang), s=Math.sin(ang), t=1-c;
  out[0]=t*ax*ax+c;    out[1]=t*ax*ay+s*az; out[2]=t*ax*az-s*ay;
  out[3]=t*ax*ay-s*az; out[4]=t*ay*ay+c;    out[5]=t*ay*az+s*ax;
  out[6]=t*ax*az+s*ay; out[7]=t*ay*az-s*ax; out[8]=t*az*az+c;
  return out;
}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};

/* ══════════════════════════════════════════════════════════════════════
   1.  CPU noise  (improved Perlin, 3D)
   ══════════════════════════════════════════════════════════════════════ */
/* every visit is a different world; append #seed=12345 to the url to
   return to a particular one */
const SEED = (()=>{
  const m = /seed=(\d+)/.exec(location.hash||"");
  return m ? ((+m[1])>>>0) : ((Math.random()*4294967296)>>>0);
})();

/* Every tunable in one place, and every one of them overridable from the URL:
   #seed=7&step=0.009&spread=1.4 is an experiment with no edit, and any world
   worth keeping is a link. A separate config file cannot ship — verify.js
   fails the build on a fetched script and it would break file:// — so this
   block is the single place instead. See docs/plants-design.md. */
const PARAMS = {
  plants:  1,       // 0 turns the whole thing off
  seeds:   40,      // starting nodes
  budget:  130000,  // hard cap on live nodes
  grow:    900,     // bud attempts per simulation tick
  step:    0.0055,  // angular distance from a node to its child (radians)
  collide: 0.72,    // refusal radius, as a fraction of a step. Geometry, not
                    // taste: at 1.0 a node holds 5 children and turns die
                    // beyond 120 degrees; 8 children needs 0.68 or less.
  kids:    6,       // cap on children, though collision usually binds first
  tries:   22,      // consecutive refusals before a node leaves the frontier
  spread:  0.80,    // footprint radius across the branch, per step
  soft:    0.50,    // how soft the footprint edge is, 0..1
  alpha:   0.80,    // how much of the ground a mature node hides
  mature:  90,      // ticks from bud to full width
  life:    1500,    // ticks per unit of fit; a pure specialist at home gets 5x
  viable:  0.40,    // fit below which a node will not even be attempted
  kin:     0.72,    // how much a crowd of near-relatives shortens a life
  kinr:    3.0,     // how far that crowd is counted, in steps
  kind:    1.30,    // affinity distance within which a neighbour counts as kin
  rare:    0.00,    // how much being a COMMON strategy globally shortens a life
  mut:     1.00,    // strength of the mutation minted at each bifurcation
  minfrag: 5,       // a severed piece smaller than this is not viable
  hostile: 150,     // ticks a node lasts on ground that does not suit it at all
  sweep:   40,      // ticks between one pass of connected-component labelling
  perbody: 0,       // 1 = at most one bud per body per turn, 0 = by frontier
  spore:   0.004,   // chance a bud is thrown clear instead, founding a body
  settle:  400,     // ticks a young body is spared the fragment cull
  rot:     900,     // ticks dead wood holds before the connection rots through
};
(function(){
  const h = location.hash || "";
  for(const k in PARAMS){
    const m = new RegExp("[#&]"+k+"=(-?[0-9.]+)").exec(h);
    if(m) PARAMS[k] = parseFloat(m[1]);
  }
})();

const PERM = new Uint16Array(512);
(function(){
  const p=new Uint16Array(256); for(let i=0;i<256;i++)p[i]=i;
  let s=(SEED ^ 0x9e3779b9)>>>0 || 1;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)PERM[i]=p[i&255];
})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
function grad(h,x,y,z){
  switch(h&15){
    case 0:return x+y; case 1:return -x+y; case 2:return x-y; case 3:return -x-y;
    case 4:return x+z; case 5:return -x+z; case 6:return x-z; case 7:return -x-z;
    case 8:return y+z; case 9:return -y+z; case 10:return y-z; case 11:return -y-z;
    case 12:return y+x; case 13:return -y+z; case 14:return y-x; default:return -y-z;
  }
}
function noise3(x,y,z){
  const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z);
  const X=fx&255,Y=fy&255,Z=fz&255;
  x-=fx;y-=fy;z-=fz;
  const u=fade(x),v=fade(y),w=fade(z);
  const A=PERM[X]+Y, AA=PERM[A]+Z, AB=PERM[A+1]+Z;
  const B=PERM[X+1]+Y, BA=PERM[B]+Z, BB=PERM[B+1]+Z;
  const l=(a,b,t)=>a+t*(b-a);
  return l(l(l(grad(PERM[AA],x,y,z),      grad(PERM[BA],x-1,y,z),u),
             l(grad(PERM[AB],x,y-1,z),    grad(PERM[BB],x-1,y-1,z),u),v),
           l(l(grad(PERM[AA+1],x,y,z-1),  grad(PERM[BA+1],x-1,y,z-1),u),
             l(grad(PERM[AB+1],x,y-1,z-1),grad(PERM[BB+1],x-1,y-1,z-1),u),v),w);
}

/* ══════════════════════════════════════════════════════════════════════
   2.  the world  — simulation on an equirectangular grid
   ══════════════════════════════════════════════════════════════════════ */
const GW=320, GH=160, GN=GW*GH;

const F = {
  h:    new Float32Array(GN),   // elevation, roughly -1 .. 1
  veg:  new Float32Array(GN),   // 0..1
  moist:new Float32Array(GN),   // 0..1
  snow: new Float32Array(GN),   // 0..1
  temp: new Float32Array(GN),   // celsius
  tn:   new Float32Array(GN),   // drifting temperature anomaly
  mn:   new Float32Array(GN),   // drifting moisture anomaly
  prox: new Float32Array(GN),   // blurred "water nearby"
  sold: new Float32Array(GN),   // previous snow, for the ice feedback
  tmp:  new Float32Array(GN),
  tmp2: new Float32Array(GN)
};
const DIR = new Float32Array(GN*3);
const LAT = new Float32Array(GH);
const COSLAT = new Float32Array(GH);
let areaTotal = 0;
for(let j=0;j<GH;j++){
  const lat = Math.PI*0.5 - (j+0.5)/GH*Math.PI;
  LAT[j]=lat; COSLAT[j]=Math.cos(lat);
  for(let i=0;i<GW;i++){
    const lon = (i+0.5)/GW*Math.PI*2 - Math.PI;
    const k=(j*GW+i)*3;
    DIR[k  ]=Math.cos(lat)*Math.cos(lon);
    DIR[k+1]=Math.sin(lat);
    DIR[k+2]=Math.cos(lat)*Math.sin(lon);
  }
  areaTotal += COSLAT[j]*GW;
}

/* --- terrain octaves: each one slowly rotates on its own axis, and slowly
       breathes in amplitude.  that is what makes coastlines migrate. ----- */
const OCT = 6;
const oFreq = [1.25, 2.35, 4.4, 8.3, 15.5, 29.0];
const oAmp  = [0.60, 0.30, 0.16, 0.085, 0.045, 0.024];
const oAxis = [], oSpin = [], oBreathA = [], oBreathW = [], oBreathP = [];
(function(){
  let s=(SEED*2654435761)>>>0 || 7;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  for(let o=0;o<OCT;o++){
    let x=rnd()*2-1,y=rnd()*2-1,z=rnd()*2-1;
    const l=1/Math.hypot(x,y,z); oAxis.push([x*l,y*l,z*l]);
    oSpin.push(4.6e-5 * (1 + o*0.62) * (rnd()<0.5?-1:1));
    /* low octaves breathe gently (they set the land/sea balance);
       high octaves breathe hard (they reshape coasts) */
    oBreathA.push(0.15 + 0.12*o);
    oBreathW.push(2*Math.PI/(3000 + rnd()*7000));
    oBreathP.push(rnd()*Math.PI*2);
  }
})();
const ridgeAxis=[0.31,0.82,-0.48], ridgeSpin=2.4e-5;
const tnAxis=[0.77,-0.31,0.56], tnSpin=5.5e-5;
const mnAxis=[-0.42,0.61,0.67], mnSpin=6.5e-5;

const S = {
  time: 0,            // simulated seconds
  epoch0: 0,          // clock zero, set once the world has settled
  seaLevel: 0.02,
  globalTemp: 3.4,
  globalHum: 0.27,
  solarLat: 0.0,
  stats: {ocean:0.6, ice:0.08, desert:0.2, forest:0.2, grass:0.1, temp:14}
};
const TARGET = {ocean:0.635, ice:0.090, desertOfLand:0.225};
const YEAR = 900;           // simulated seconds per orbit
const TILT = 24*Math.PI/180;

/* Which way the axis leans. The daily spin turns about this, so the axis
   itself is fixed in space — which is why the ring, which shares the plane,
   can be built once and never touched again. */
const AZ0 = 0.34;
const POLE = (()=>{ const ct=Math.cos(TILT), st=Math.sin(TILT),
                    ca=Math.cos(AZ0), sa=Math.sin(AZ0);
  return [-st*ca, ct, st*sa]; })();

const rotsPerOct = [];
for(let o=0;o<OCT;o++) rotsPerOct.push(new Float32Array(9));
const ridgeM = new Float32Array(9);
const tnM = new Float32Array(9);
const mnM = new Float32Array(9);

/* rebuild a horizontal band of the terrain / anomaly fields */
function rebuildBand(j0,j1,t){
  for(let o=0;o<OCT;o++)
    axisRot(rotsPerOct[o], oAxis[o][0],oAxis[o][1],oAxis[o][2], t*oSpin[o]);
  axisRot(ridgeM, ridgeAxis[0],ridgeAxis[1],ridgeAxis[2], t*ridgeSpin);
  axisRot(tnM, tnAxis[0],tnAxis[1],tnAxis[2], t*tnSpin);
  axisRot(mnM, mnAxis[0],mnAxis[1],mnAxis[2], t*mnSpin);

  const amp=[];
  for(let o=0;o<OCT;o++)
    amp.push(oAmp[o]*(1 + oBreathA[o]*Math.sin(t*oBreathW[o]+oBreathP[o])));

  for(let j=j0;j<j1;j++){
    for(let i=0;i<GW;i++){
      const k=j*GW+i, k3=k*3;
      const dx=DIR[k3], dy=DIR[k3+1], dz=DIR[k3+2];
      let h=0;
      for(let o=0;o<OCT;o++){
        const R=rotsPerOct[o], f=oFreq[o];
        const px=(R[0]*dx+R[3]*dy+R[6]*dz)*f;
        const py=(R[1]*dx+R[4]*dy+R[7]*dz)*f;
        const pz=(R[2]*dx+R[5]*dy+R[8]*dz)*f;
        h += amp[o]*noise3(px+o*17.3, py-o*8.1, pz+o*31.7);
      }
      /* ridged mountain belts, only where there is already land */
      const rx=(ridgeM[0]*dx+ridgeM[3]*dy+ridgeM[6]*dz)*3.3;
      const ry=(ridgeM[1]*dx+ridgeM[4]*dy+ridgeM[7]*dz)*3.3;
      const rz=(ridgeM[2]*dx+ridgeM[5]*dy+ridgeM[8]*dz)*3.3;
      let r = 1 - Math.abs(noise3(rx+5.5, ry+2.2, rz-9.9))*1.9;
      r = r>0 ? r*r : 0;
      h += 0.30*r*smoothstep(-0.02, 0.30, h);

      F.h[k]=h;
      {
        const ax=tnM[0]*dx+tnM[3]*dy+tnM[6]*dz;
        const ay=tnM[1]*dx+tnM[4]*dy+tnM[7]*dz;
        const az=tnM[2]*dx+tnM[5]*dy+tnM[8]*dz;
        F.tn[k]= 0.62*noise3(ax*2.1+40.0, ay*2.1-13.0, az*2.1+7.0)
               + 0.26*noise3(ax*5.9-11.0, ay*5.9+27.0, az*5.9-4.0)
               + 0.12*noise3(ax*13.7+3.0, ay*13.7+9.0, az*13.7+51.0);
      }
      F.mn[k]=noise3((mnM[0]*dx+mnM[3]*dy+mnM[6]*dz)*2.6-22.0,
                     (mnM[1]*dx+mnM[4]*dy+mnM[7]*dz)*2.6+61.0,
                     (mnM[2]*dx+mnM[5]*dy+mnM[8]*dz)*2.6+3.0);
    }
  }
}

/* separable blur of the water mask -> "how oceanic is this neighbourhood" */
function computeProx(){
  const a=F.tmp, b=F.tmp2, sea=S.seaLevel;
  for(let k=0;k<GN;k++) a[k] = F.h[k]<sea ? 1 : 0;
  const R=3;
  for(let pass=0;pass<3;pass++){
    // horizontal (wrap)
    for(let j=0;j<GH;j++){
      const row=j*GW;
      for(let i=0;i<GW;i++){
        let s=0;
        for(let d=-R;d<=R;d++) s+=a[row+((i+d+GW)%GW)];
        b[row+i]=s/(2*R+1);
      }
    }
    // vertical (clamp)
    for(let j=0;j<GH;j++){
      const row=j*GW;
      for(let i=0;i<GW;i++){
        let s=0;
        for(let d=-R;d<=R;d++){
          const jj=clamp(j+d,0,GH-1);
          s+=b[jj*GW+i];
        }
        a[row+i]=s/(2*R+1);
      }
    }
  }
  F.prox.set(a);
}

let ctrlAccum = 0;
function stepFields(dt){
  const sea=S.seaLevel;
  S.solarLat = TILT*Math.sin(S.time/YEAR*Math.PI*2);

  const kMoist = Math.min(1, dt*0.030);
  const kSnow  = Math.min(1, dt*0.022);
  const GROW=0.0060, DECAY=0.0064, DIFF=0.0045, SDIFF=0.0075;

  const veg=F.veg, moist=F.moist, snow=F.snow, temp=F.temp, h=F.h, prox=F.prox;
  const vOld=F.tmp; vOld.set(veg);
  const sold=F.sold; sold.set(snow);

  for(let j=0;j<GH;j++){
    const lat=LAT[j], row=j*GW;
    const mLat = clamp(0.5+0.5*Math.cos(lat*6.0), 0, 1);
    /* these depend only on latitude, so compute them once per row */
    let cL=Math.cos(lat-S.solarLat);      if(cL<0) cL=0;
    let cW=Math.cos(lat-S.solarLat*0.35); if(cW<0) cW=0;
    const cpL=Math.pow(cL,0.85), cpW=Math.pow(cW,0.85);
    const TbL=-30+62*cpL,        TbW=-30+62*cpW;
    const ampL=0.45+1.25*(1-cpL),ampW=0.45+1.25*(1-cpW);
    for(let i=0;i<GW;i++){
      const k=row+i;
      const hk=h[k], water = hk<sea;
      const land = hk-sea;
      const im=(i-1+GW)%GW, ip=(i+1)%GW;
      const jm=j>0?j-1:j, jp=j<GH-1?j+1:j;
      const n0=row+im, n1=row+ip, n2=jm*GW+i, n3=jp*GW+i;

      /* ---- temperature (global warming/cooling is polar-amplified,
             so the controller can move the ice line without frying
             the tropics) ---- */
      let T = water ? TbW : TbL - land*52;
      T += F.tn[k]*7.0 + S.globalTemp*(water ? ampW : ampL);
      /* ice-albedo feedback: white ground keeps itself cold. this is what
         makes ice sheets ragged and sticky instead of a latitude circle */
      const sPrev = sold[k];
      T -= sPrev*4.2;
      temp[k]=T;

      /* ---- moisture ---- */
      let mt = mLat*(0.30+0.78*prox[k]) + 0.20*F.mn[k] + S.globalHum;
      mt *= 0.32 + 0.68*smoothstep(-30,-2,T);
      if(water) mt = Math.max(mt, 0.82);
      mt = clamp(mt,0,1);
      moist[k] += (mt-moist[k])*kMoist;

      /* ---- snow & ice ---- */
      let st = water ? smoothstep(-1.0,-8.0,T) : smoothstep(3.0,-6.0,T);
      /* snow has to fall before it can lie: cold *dry* ground stays bare */
      if(!water) st *= 0.40 + 0.60*smoothstep(0.14,0.50,moist[k]);
      let sv = sPrev + (st-sPrev)*kSnow;
      /* ice creeps into its neighbours, so sheets grow tongues and outliers */
      sv += SDIFF*dt*((sold[n0]+sold[n1]+sold[n2]+sold[n3])*0.25 - sPrev);
      snow[k] = sv<0 ? 0 : (sv>1 ? 1 : sv);

      /* ---- vegetation ---- */
      if(water){ veg[k] += (0-veg[k])*Math.min(1,dt*0.05); continue; }
      const wf = smoothstep(0.24,0.56,moist[k]);
      const tf = smoothstep(-9,3,T)*(1-smoothstep(33,45,T));
      const s = wf*tf*(1-snow[k]*0.55);
      let v = vOld[k];
      v += dt*(GROW*s*(1-v) - DECAY*(1-s)*v - 0.0004*v);

      /* diffusion from land neighbours -> colonisation fronts */
      let sum=0,n=0;
      if(h[n0]>=sea){sum+=vOld[n0];n++;}
      if(h[n1]>=sea){sum+=vOld[n1];n++;}
      if(h[n2]>=sea){sum+=vOld[n2];n++;}
      if(h[n3]>=sea){sum+=vOld[n3];n++;}
      if(n) v += DIFF*dt*(sum/n - v);
      veg[k]=clamp(v,0,1);
    }
  }

  /* ---------- homeostasis: keep every environment in the picture -------- */
  ctrlAccum += dt;
  if(ctrlAccum >= 2.5){
    const d=ctrlAccum; ctrlAccum=0;
    let aOcean=0,aIce=0,aDesert=0,aForest=0,aGrass=0,aTundra=0,tSum=0,aLand=0;
    for(let j=0;j<GH;j++){
      const w=COSLAT[j], row=j*GW;
      for(let i=0;i<GW;i++){
        const k=row+i;
        tSum += temp[k]*w;
        if(h[k]<S.seaLevel){ aOcean+=w; if(snow[k]>0.45) aIce+=w; }
        else{
          aLand+=w;
          if(snow[k]>0.45) aIce+=w;
          else if(veg[k]<0.18) { if(temp[k]>2) aDesert+=w; else aTundra+=w; }
          else if(veg[k]<0.55) aGrass+=w;
          else aForest+=w;
        }
      }
    }
    const ocean=aOcean/areaTotal, ice=aIce/areaTotal, land=Math.max(1e-6,aLand/areaTotal);
    const desert=aDesert/areaTotal;
    S.stats={ocean, ice, desert, tundra:aTundra/areaTotal,
             forest:aForest/areaTotal, grass:aGrass/areaTotal,
             land, temp:tSum/areaTotal};

    /* deserts are steered as a share of *land*, so the target does not
       drift when sea level moves the coastline */
    const desertOfLand = desert/land;

    /* corrections are rate-limited so the loop stays stable no matter how
       large a time step the time-lapse hands it */
    const dSea = clamp((TARGET.ocean - ocean)*0.055*d, -0.020, 0.020);
    const dT   = clamp((ice - TARGET.ice)*0.55*d,      -0.30,  0.30);
    const dH   = clamp((desertOfLand - TARGET.desertOfLand)*0.040*d, -0.012, 0.012);
    S.seaLevel   = clamp(S.seaLevel   + dSea, -0.50, 0.50);
    S.globalTemp = clamp(S.globalTemp + dT,   -14, 14);
    S.globalHum  = clamp(S.globalHum  + dH,   -0.56, 0.52);
  }
}

/* pack the fields into the float texture the GPU reads */
const TEXDATA = new Float32Array(GN*4);
function packTexture(){
  for(let k=0,p=0;k<GN;k++,p+=4){
    TEXDATA[p  ]=F.h[k];
    TEXDATA[p+1]=F.veg[k];
    TEXDATA[p+2]=F.snow[k];
    TEXDATA[p+3]=F.moist[k];
  }
}

/* ══════════════════════════════════════════════════════════════════════
   2b. plants — stage 0
   ══════════════════════════════════════════════════════════════════════
   Legibility only. Hand-written growth, no genome, no death, no evolution:
   the single question this stage exists to answer is whether a branching
   structure at planetary scale reads as vegetation or as circuitry. Every
   later stage is built on that answer, so it is worth having before any of
   them. See docs/plants-design.md.

   Nodes carry a position and a heading, both as 3D unit vectors. Storing a
   heading as an angle from north would break at the poles and at the seam —
   this repo has that scar already. Growth turns the heading about the surface
   normal, steps along the geodesic, and parallel-transports the heading to
   where it lands, which is pole-free by construction. */

let plantsOn = PARAMS.plants > 0;

const PW = 2048, PH = 1024;                 // the sheet plants are drawn into

const PMAX  = PARAMS.budget|0;
const NPX=new Float32Array(PMAX), NPY=new Float32Array(PMAX), NPZ=new Float32Array(PMAX);
const NHX=new Float32Array(PMAX), NHY=new Float32Array(PMAX), NHZ=new Float32Array(PMAX);
const NKID=new Uint8Array(PMAX), NFAIL=new Uint8Array(PMAX);
const NLIVE=new Uint8Array(PMAX), NBIN=new Int32Array(PMAX);
const NBORN=new Int32Array(PMAX), NLIFE=new Int32Array(PMAX);
const NPAR=new Int32Array(PMAX), NPGEN=new Int32Array(PMAX), NGEN=new Int32Array(PMAX);
const PFRONT = new Int32Array(PMAX), PFREE = new Int32Array(PMAX);
let nodeHigh = 0, liveN = 0, frontN = 0, freeN = 0;
let ptick = 0, reapCursor = 0, plantsDirty = true, deaths = 0, woodN = 0, comps = 0, meanComp = 0, bigFrag = 0;
const NLK=new Int32Array(PMAX);      // children still standing, alive or wood
const CSTAMP=new Int32Array(PMAX);   // last turn a body was allowed to bud

/* its own stream, so changing plant parameters cannot shift the terrain */
let pseed = (SEED ^ 0x85ebca6b)>>>0 || 1;
function prnd(){ pseed=(pseed*1664525+1013904223)>>>0; return pseed/4294967296; }

/* ---- the genome ----
   Eleven numbers, inherited whole and mutated where a branch forks. Numbers
   before programs: this is enough for real selection — specialists against
   generalists, fast and cheap against slow and tough — and if lineages will
   not differentiate on eleven floats they will not differentiate on sixty
   instructions either, only it will be much harder to see why. Conditional
   behaviour, and with it any question about formula length, comes after.

   The first five are affinities for the five environments the climate
   controller already holds in balance. That is the whole argument for this
   planet as an arena: the controller guarantees each of the five continues to
   exist and merely moves it, so a specialist for any one of them always has
   somewhere to live, and never has it for long. */
const G = 11;                   // genes per node
const G_SEA=0, G_ICE=1, G_DES=2, G_GRA=3, G_FOR=4,
      G_PACE=5, G_BRANCH=6, G_TURN=7, G_WANDER=8, G_SPREAD=9, G_ELONG=10;
const GENE = new Float32Array(PMAX*G);
/* lo, hi, mutation step */
const GLIM = [
  [0.02,5,0.30],[0.02,5,0.30],[0.02,5,0.30],[0.02,5,0.30],[0.02,5,0.30],
  [0.00,1.00,0.10],   // pace: growth bought with lifespan
  [0.05,0.75,0.07],   // branch
  [0.20,1.50,0.14],   // turn
  [0.05,0.90,0.09],   // wander
  [0.40,1.40,0.10],   // spread
  [1.00,3.50,0.25],   // elongation
];
/* Nothing costs affinity and lifespan rises with it, so unconstrained they all
   drift upward until every node likes everything and lives for ever — not
   hyperspecialisation but affinity inflation, ending in a bland immortal
   generalist. A fixed budget makes specialising zero-sum, so "generalists
   short-lived, specialists long-lived at home" follows from the structure
   rather than from tuning. */
function normalise(o){
  let sum=0;
  for(let i=0;i<5;i++){ if(GENE[o+i]<0.02) GENE[o+i]=0.02; sum+=GENE[o+i]; }
  const f=5/sum;
  for(let i=0;i<5;i++) GENE[o+i]*=f;
}
function mutate(src,dst,amt){
  for(let i=0;i<G;i++){
    let v = GENE[src+i] + (prnd()*2-1)*GLIM[i][2]*amt;
    GENE[dst+i] = Math.max(GLIM[i][0], Math.min(GLIM[i][1], v));
  }
  normalise(dst);
}

/* ---- what a place is ----
   Soft membership of the five, summing to one, so there are no hard biome
   edges for a genome to snap against. */
const ENV = new Float32Array(5);
function sstep(x,a,b){ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); }
function envAt(k){
  const land=F.h[k]-S.seaLevel;
  const water = 1 - sstep(land, 0.0, 0.014);
  const ice   = sstep(F.snow[k], 0.30, 0.58);
  const rest  = 1 - ice;
  const veg   = F.veg[k];
  const forest = sstep(veg, 0.42, 0.74);
  const grass  = sstep(veg, 0.13, 0.38)*(1-forest);
  const desert = Math.max(0, 1 - forest - grass);
  const dry    = (1-water)*rest;
  ENV[0]=water*rest; ENV[1]=ice;
  ENV[2]=dry*desert; ENV[3]=dry*grass; ENV[4]=dry*forest;
  return ENV;
}

/* How well a genome suits a place. A generalist scores about 1 everywhere; a
   specialist scores up to 5 at home and almost nothing away from it. Lifespan
   reads straight off this and is never itself a gene: a lifespan gene under
   selection only ratchets toward immortality, whereas fit means the ground
   sculpts how long a body persists, and a niche that walks away kills what it
   left behind. */
function fitOf(o,k){
  const m=envAt(k);
  return GENE[o]*m[0]+GENE[o+1]*m[1]+GENE[o+2]*m[2]+GENE[o+3]*m[3]+GENE[o+4]*m[4];
}
function fitAt(x,y,z,o){ return fitOf(o, cellAt(x,y,z)); }

/* ---- colour is a fixed projection of the genome, never a lineage palette ----
   Hue says which of the five a lineage is for, so related plants look related
   and convergent evolution shows up as the same colour appearing twice in
   similar places. Saturation says how committed it is, so generalists wash out
   toward grey. Lightness carries the life-history axis. */
const ENVCOL = [
  [ 96,132, 74],   // sea
  [206,206,224],   // ice
  [176, 98, 42],   // desert
  [162,158, 60],   // grass
  [ 34, 88, 66],   // forest
];
function geneColour(o,out){
  let r=0,g=0,b=0,mx=0;
  for(let i=0;i<5;i++){
    const w=GENE[o+i]*0.2;
    r+=ENVCOL[i][0]*w; g+=ENVCOL[i][1]*w; b+=ENVCOL[i][2]*w;
    if(GENE[o+i]>mx) mx=GENE[o+i];
  }
  const spec = Math.max(0, Math.min(1, (mx-1)/3));       // 0 generalist, 1 pure
  const lum = 0.30*r+0.59*g+0.11*b;
  const sat = 0.30+0.70*spec;
  const lift = 0.82+0.36*GENE[o+G_PACE];                 // fast lineages are paler
  out[0]=(lum+(r-lum)*sat)*lift;
  out[1]=(lum+(g-lum)*sat)*lift;
  out[2]=(lum+(b-lum)*sat)*lift;
}

/* ---- collision: a uniform bin over the cube the sphere sits in. No poles,
   no seam, and a query touches 27 bins whatever the latitude. ---- */
const PCELL = PARAMS.step*PARAMS.collide;
const PGRID = Math.max(8, Math.min(250, Math.floor(2/PCELL)));
const pbins = new Map();
function binOf(x,y,z){
  const i=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const j=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const k=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  return (i*PGRID+j)*PGRID+k;
}
function occupied(x,y,z){
  const i=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const j=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const k=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  const r2 = PCELL*PCELL;
  for(let a=-1;a<=1;a++){
    const ia=i+a; if(ia<0||ia>=PGRID) continue;
    for(let b=-1;b<=1;b++){
      const jb=j+b; if(jb<0||jb>=PGRID) continue;
      for(let c=-1;c<=1;c++){
        const kc=k+c; if(kc<0||kc>=PGRID) continue;
        const list = pbins.get((ia*PGRID+jb)*PGRID+kc);
        if(!list) continue;
        for(let n=0;n<list.length;n++){
          const t=list[n];
          const dx=NPX[t]-x, dy=NPY[t]-y, dz=NPZ[t]-z;
          if(dx*dx+dy*dy+dz*dz < r2) return true;
        }
      }
    }
  }
  return false;
}

function unbin(i){
  const list = pbins.get(NBIN[i]);
  if(!list) return;
  const at = list.indexOf(i);
  if(at >= 0){ list[at] = list[list.length-1]; list.pop(); }
}

/* Risk rising with the density of genetically similar neighbours -- Janzen and
   Connell's rule, and the reason a tropical forest is not one species. It is the
   only pressure here that punishes whatever is *common* rather than punishing
   breadth as such, so it acts against a generalist sweep without penalising
   generalism itself. Measured necessary, not optional: at x1 and at x100 the
   climate maintained no more specialisation than a frozen planet did, so the
   claim that a wandering niche keeps adaptation from completing does not hold
   on its own. It cannot -- the controller relocates environments but keeps each
   of them present, so a specialist's ground moves without shrinking, while
   following it means growing through country only a generalist can cross. */
function kinPressure(i){
  const x=NPX[i], y=NPY[i], z=NPZ[i], o=i*G;
  const R=PARAMS.kinr*PARAMS.step, r2=R*R, d2max=PARAMS.kind*PARAMS.kind;
  const gi=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const gj=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const gk=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  const span=Math.max(1,Math.ceil(R/(2/PGRID)));
  let kin=0, all=0;
  for(let a=-span;a<=span;a++){
    const ia=gi+a; if(ia<0||ia>=PGRID) continue;
    for(let b=-span;b<=span;b++){
      const jb=gj+b; if(jb<0||jb>=PGRID) continue;
      for(let c=-span;c<=span;c++){
        const kc=gk+c; if(kc<0||kc>=PGRID) continue;
        const list=pbins.get((ia*PGRID+jb)*PGRID+kc);
        if(!list) continue;
        for(let n=0;n<list.length;n++){
          const t=list[n]; if(t===i) continue;
          const dx=NPX[t]-x, dy=NPY[t]-y, dz=NPZ[t]-z;
          if(dx*dx+dy*dy+dz*dz > r2) continue;
          all++;
          const to=t*G; let d=0;
          for(let g=0;g<5;g++){ const e=GENE[o+g]-GENE[to+g]; d+=e*e; }
          if(d < d2max) kin++;
        }
      }
    }
  }
  return all>0 ? kin/all : 0;
}

/* The strategy a genome is pursuing, coarsely: which of the five it leans on,
   and how hard. Coarse on purpose — scored finely enough, every lineage is
   unique, everyone is rare, and frequency dependence has nothing to bite on. */
const CENSUS = new Int32Array(32);
let censusN = 0, kinMean = 0, kinSpread = 0;
let dbgHits=0, dbgCrowd=0, dbgLife=0, dbgAgeDeaths=0, dbgFit=0, dbgRaw=0, dbgNaN=0, dbgFloor=0, dbgFitOk=0;
function strategyOf(o){
  let mx=0, at=0;
  for(let g=0;g<5;g++) if(GENE[o+g]>mx){ mx=GENE[o+g]; at=g; }
  const spec = Math.max(0, Math.min(0.999, (mx-1)/4));
  return at*4 + ((spec*4)|0);
}
/* Rarity has to be measured where rarity exists. A neighbourhood cannot see it:
   growth here is clonal and local, so a node sits among its own siblings whether
   its strategy is unique in the world or universal. Count the whole living
   population instead, and let being common be what costs. */
function census(){
  CENSUS.fill(0); censusN = 0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    CENSUS[strategyOf(i*G)]++; censusN++;
  }
}
function commonness(o){ return censusN>0 ? CENSUS[strategyOf(o)]/censusN : 0; }

function cellAt(x,y,z){
  const lat=Math.asin(Math.max(-1,Math.min(1,y)));
  const lon=Math.atan2(z,x);
  let i=Math.floor((lon+Math.PI)/(Math.PI*2)*GW); i=((i%GW)+GW)%GW;
  let j=Math.floor((Math.PI*0.5-lat)/Math.PI*GH);
  j=Math.max(0,Math.min(GH-1,j));
  return j*GW+i;
}
/* Stage 0 stands in for the affinity formulas: a flat yes/no on where a node
   may sit. Crude, but it is what makes the form read as vegetation rather
   than as a pattern laid over a planet. */
/* ---- what the renderer is handed ----
   Nodes are not painted into a buffer any more. A node that dies has to stop
   being drawn, and there is no way to un-paint a footprint that has already
   been blended with its neighbours — so the sheet is rebuilt from the live set
   each tick instead, on the GPU, where fifty thousand quads cost nothing.
   Everything the look depends on becomes a per-node attribute for free. */
const GC = new Float32Array(3);
const INST = 9;                                  // floats per node
const IBUF = new Float32Array(PMAX*INST);
let instN = 0;

function buildInstances(){
  const sp0=PARAMS.spread*PARAMS.step, mat=Math.max(1,PARAMS.mature);
  let w=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===0) continue;
    const wood = NLIVE[i]===2;
    const x=NPX[i], y=NPY[i], z=NPZ[i];
    const lat=Math.asin(Math.max(-1,Math.min(1,y))), lon=Math.atan2(z,x);
    const cl=Math.max(Math.cos(lat),1e-3);
    const sl=Math.sin(lat), sn=Math.sin(lon), cs=Math.cos(lon);
    const hx=NHX[i], hy=NHY[i], hz=NHZ[i];
    const he=-hx*sn + hz*cs;
    const hn=-hx*sl*cs + hy*cl - hz*sl*sn;

    /* A branch reads as a branch because it tapers. Width comes from age, so
       the old wood near the root is broad and the growing tips are fine —
       which is also the frontier, and also what is about to die. One variable
       tells all three. */
    const age=ptick-NBORN[i];
    const grow=wood ? 1 : Math.min(1, age/mat);
    const go=i*G;
    const wid=sp0*GENE[go+G_SPREAD]*(0.30+0.70*grow);

    /* colour: the form's own, drifted by the sector's inherited tint and
       lifted at the young tips, so expansion reads as motion */
    geneColour(go, GC);
    const young=1-grow;
    let r=GC[0]+young*44, g=GC[1]+young*40, b=GC[2]+young*34;
    /* Dead wood is not black. Black would swamp hue, which is the channel
       carrying niche, and half the standing structure would go to it — the
       planet would read as scorched. Keep the lineage's hue, take the colour
       and the value out of it, and let more ground show through: one value
       ramp from bright new tip to grey wood, so growth and die-back both read
       as movement. */
    if(wood){
      const lum=0.30*r+0.59*g+0.11*b;
      r=(r*0.24+lum*0.76)*0.52; g=(g*0.24+lum*0.76)*0.52; b=(b*0.24+lum*0.76)*0.52;
    }

    IBUF[w  ]=(lon+Math.PI)/(Math.PI*2);
    IBUF[w+1]=(Math.PI*0.5-lat)/Math.PI;
    IBUF[w+2]=wid*GENE[go+G_ELONG];
    IBUF[w+3]=wid;
    IBUF[w+4]=Math.atan2(hn,he);
    IBUF[w+5]=Math.min(255,r)/255;
    IBUF[w+6]=Math.min(255,g)/255;
    IBUF[w+7]=Math.min(255,b)/255;
    IBUF[w+8]=PARAMS.alpha*(0.45+0.55*grow)*(wood?0.62:1.0);
    w+=INST;
  }
  instN=w/INST;
}

function addNode(x,y,z,hx,hy,hz,src,par,amt){
  const i = freeN>0 ? PFREE[--freeN] : nodeHigh++;
  NPX[i]=x; NPY[i]=y; NPZ[i]=z;
  NHX[i]=hx; NHY[i]=hy; NHZ[i]=hz;
  NKID[i]=0; NFAIL[i]=0; NLIVE[i]=1;
  const o=i*G;
  if(src<0){ for(let n=0;n<G;n++) GENE[o+n]=GLIM[n][0]+prnd()*(GLIM[n][1]-GLIM[n][0]); normalise(o); }
  else if(amt>0) mutate(src*G, o, amt);
  else { const so=src*G; for(let n=0;n<G;n++) GENE[o+n]=GENE[so+n]; }
  NGEN[i]++; NPAR[i]=par; NPGEN[i] = par>=0 ? NGEN[par] : -1;
  NLK[i]=0; if(par>=0) NLK[par]++;
  PROOT[i] = par>=0 ? PROOT[par] : i;   /* body identity, kept fresh between sweeps */
  NBORN[i]=ptick;
  /* pace buys growth with life: a weed is quick and brief, a persister slow
     and durable, and cleared ground becomes an opening only a weed can take */
  const pace=GENE[o+G_PACE];
  NLIFE[i]=Math.max(PARAMS.hostile|0,
    (PARAMS.life*fitAt(x,y,z,o)*(1.40-0.80*pace))|0);
  const key = binOf(x,y,z);
  NBIN[i]=key;
  const list = pbins.get(key);
  if(list) list.push(i); else pbins.set(key,[i]);
  /* dead nodes are dropped from the frontier lazily, so it carries some slack;
     never let that slack run off the end of the array */
  if(frontN < PMAX) PFRONT[frontN++] = i;
  liveN++; plantsDirty=true;
  return i;
}

/* A node that dies still holding children does not vanish: it stops growing,
   stops counting as alive, and stays in the tree as structure — heartwood,
   which is dead in a real trunk too and still holds the tree up. It is let go
   only when its last child goes, and then its own dead parent may follow.
   Without this, ageing alone split a fifth of all deaths into separate bodies
   and nothing could grow larger than about ten nodes; splitting is now
   something only the world can do, by killing a whole region. */
function freeNode(i){
  for(let j=i;;){
    const par = rooted(j) ? NPAR[j] : -1;
    if(NLIVE[j]===2) woodN--;
    NLIVE[j]=0; unbin(j); PFREE[freeN++]=j;
    if(par<0) break;
    if(--NLK[par] > 0) break;
    if(NLIVE[par]!==2) break;      /* a living parent simply loses a child */
    j = par;                       /* wood with nothing left to hold: let go */
  }
  plantsDirty=true;
}

function killNode(i){
  if(NLIVE[i]!==1) return;
  liveN--; deaths++; plantsDirty=true;
  if(NLK[i]>0){
    /* Wood holds the body together but stops holding *ground*. Left in the
       collision bins it walled off two fifths of the planet against the very
       plants that made it, and a body could never grow back through its own
       dead interior — which is exactly what a crust does. */
    NLIVE[i]=2; woodN++; unbin(i);
    /* Wood is only ever released from the tips inward, while growth runs the
       other way, so it accumulates without limit and eventually crowds the
       living out. Real crust sheds. Give it its own clock: when it rots
       through, whatever it was holding becomes a body in its own right — so
       decay, not ageing, is what fragments a plant, at a rate we choose. */
    NLIFE[i] = (ptick - NBORN[i]) + (PARAMS.rot|0);
  }
  else freeNode(i);
}

/* All nodes die, and because lifespan follows fit the oldest wood is nearest
   the root — so a body hollows out from the middle and breaks into a ring of
   pieces that go on independently. Checked a slice at a time on a rolling
   cursor, the way the terrain is rebuilt, rather than scanning every node
   every tick. */
function reap(){
  const slice = Math.max(256, (nodeHigh/9)|0);
  for(let n=0;n<slice;n++){
    const i = reapCursor++; if(reapCursor>=nodeHigh) reapCursor=0;
    if(NLIVE[i]===0) continue;
    if(NLIVE[i]===2){
      if(ptick-NBORN[i] > NLIFE[i]) freeNode(i);   /* rotted through */
      continue;
    }
    if(ptick-NBORN[i] > NLIFE[i]){ dbgAgeDeaths++; killNode(i); continue; }
    /* The climate moves under them, so the ground is re-read and the allowance
       revised. Hostile ground shortens a life, it does not end one: a node that
       the sea has just closed over goes on for a while and then expires early,
       which is both what was intended and far less violent than killing on
       sight. Killing outright severed a body at every interior node the moment
       a niche shifted, and the shower of fragments that followed read as the
       design failing when it was only this. */
    if((n&7)===0){
      const o=i*G, f=fitAt(NPX[i],NPY[i],NPZ[i],o);
      const crowd = PARAMS.kin>0 ? kinPressure(i) : 0;
      const freq  = PARAMS.rare>0 ? commonness(o) : 0;
      const nl = Math.max(PARAMS.hostile|0,
        (PARAMS.life*f*(1.40-0.80*GENE[o+G_PACE])
          *(1-PARAMS.kin*crowd)*(1-PARAMS.rare*freq))|0);
      const raw = PARAMS.life*f*(1.40-0.80*GENE[o+G_PACE])*(1-PARAMS.kin*crowd)*(1-PARAMS.rare*freq);
      dbgHits++; dbgCrowd+=crowd; dbgLife+=nl;
      if(!isFinite(f)) dbgNaN++; else { dbgFit+=f; dbgFitOk++; dbgRaw+=raw; if(raw < (PARAMS.hostile|0)) dbgFloor++; }
      NLIFE[i]=nl;
    }
  }
}

function bud(ni){
  const go = ni*G;
  const px=NPX[ni], py=NPY[ni], pz=NPZ[ni];
  const hx=NHX[ni], hy=NHY[ni], hz=NHZ[ni];

  /* The first child continues the sector; later children are true
     bifurcations and take a decisive turn. That distinction is where the
     genome will be minted once there is one. */
  /* A tip that has just been refused casts about instead of pushing at the
     same wall. Without this a node fails its allowance of tries in nearly the
     same direction every time and retires with open ground beside it, and
     growth stalls at a fraction of the land. */
  const th = NFAIL[ni] > 0
    ? (prnd()*2-1)*2.0
    : NKID[ni] > 0
      ? (prnd()<0.5?-1:1)*GENE[go+G_TURN]*(0.65+0.7*prnd())
      : (prnd()-0.5)*2*GENE[go+G_WANDER];

  /* turn the heading about the surface normal */
  const cx=py*hz-pz*hy, cy=pz*hx-px*hz, cz=px*hy-py*hx;
  const c=Math.cos(th), s=Math.sin(th);
  const ax=hx*c+cx*s, ay=hy*c+cy*s, az=hz*c+cz*s;

  /* step along the geodesic, and carry the heading with it */
  const d=PARAMS.step, cd=Math.cos(d), sd=Math.sin(d);
  let nx=px*cd+ax*sd, ny=py*cd+ay*sd, nz=pz*cd+az*sd;
  let l=1/Math.hypot(nx,ny,nz); nx*=l; ny*=l; nz*=l;
  let ex=-px*sd+ax*cd, ey=-py*sd+ay*cd, ez=-pz*sd+az*cd;
  const dp=ex*nx+ey*ny+ez*nz; ex-=nx*dp; ey-=ny*dp; ez-=nz*dp;
  l=1/Math.hypot(ex,ey,ez); ex*=l; ey*=l; ez*=l;

  if(fitAt(nx,ny,nz,go) < PARAMS.viable) return false;
  if(occupied(nx,ny,nz)) return false;
  /* The first child continues the sector on its parent's genome exactly; the
     second and later are true bifurcations and mint a mutated one. Mutating
     every node instead would let drift inside one body swamp the differences
     between bodies — lineages would blur and selection could not accumulate.
     This way a sector is a coherent unit for selection to act on, and a piece
     that breaks off carries a real identity rather than a smear. */
  addNode(nx,ny,nz,ex,ey,ez,ni,ni, NKID[ni] > 0 ? PARAMS.mut : 0);
  NKID[ni]++;
  return true;
}

function retire(fi){ PFRONT[fi]=PFRONT[--frontN]; }

/* thrown clear of the parent, landing anywhere that suits, and rooted in its
   own right — a new body, carrying its parent's colour */
function spore(ni){
  const go = ni*G;
  for(let a=0;a<24;a++){
    const u=prnd()*2-1, ph=prnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    const x=r*Math.cos(ph), y=u, z=r*Math.sin(ph);
    if(fitAt(x,y,z,go) < PARAMS.viable) continue;
    if(occupied(x,y,z)) continue;
    let ax=-Math.sin(ph), ay=0, az=Math.cos(ph);
    const bx=y*az-z*ay, by=z*ax-x*az, bz=x*ay-y*ax;
    const th=prnd()*Math.PI*2, cc=Math.cos(th), ss=Math.sin(th);
    let hx=ax*cc+bx*ss, hy=ay*cc+by*ss, hz=az*cc+bz*ss;
    const dp=hx*x+hy*y+hz*z; hx-=x*dp; hy-=y*dp; hz-=z*dp;
    const l=1/Math.hypot(hx,hy,hz);
    addNode(x,y,z,hx*l,hy*l,hz*l,ni,-1,PARAMS.mut);
    return true;
  }
  return false;
}

/* A severed piece too small to be a body is debris: it costs bookkeeping,
   clutters any measure of diversity, and reads as noise rather than as life.
   Identity is the connected component, found by walking parent links — and a
   link is only believed when the generation matches, because a slot freed by
   one death is handed straight to the next birth and would otherwise graft a
   fragment onto a stranger. */
const PROOT=new Int32Array(PMAX), PSIZE=new Int32Array(PMAX), PSTK=new Int32Array(PMAX);
function rooted(i){
  const p=NPAR[i];
  return p>=0 && NLIVE[p]!==0 && NGEN[p]===NPGEN[i];
}
function pruneFragments(){
  const minf = PARAMS.minfrag|0;
  if(nodeHigh===0) return;
  PROOT.fill(-1,0,nodeHigh);
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===0 || PROOT[i]>=0) continue;
    let sn=0, j=i;
    for(;;){
      PSTK[sn++]=j;
      if(!rooted(j)) break;
      const p=NPAR[j];
      if(PROOT[p]>=0) break;
      j=p;
    }
    const last=PSTK[sn-1];
    const r = rooted(last) && PROOT[NPAR[last]]>=0 ? PROOT[NPAR[last]] : last;
    while(sn>0) PROOT[PSTK[--sn]]=r;
  }
  /* size is counted in living nodes: a body held up by wood alone is a corpse */
  PSIZE.fill(0,0,nodeHigh);
  for(let i=0;i<nodeHigh;i++) if(NLIVE[i]===1) PSIZE[PROOT[i]]++;
  /* A body's root is nearly always wood now, so counting living nodes that
     are their own root counts nothing at all. Count the distinct roots that
     still have anything living under them. */
  comps=0; bigFrag=0; let tot=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===0 || PROOT[i]!==i || PSIZE[i]===0) continue;
    comps++; tot+=PSIZE[i]; if(PSIZE[i]>bigFrag) bigFrag=PSIZE[i];
  }
  meanComp = comps? tot/comps : 0;
  /* A body that has just been founded is one node, which is below any sane
     minimum. Spare it until it has had time to establish, or the cull becomes
     a ratchet that removes bodies and never lets one begin. */
  const settle = PARAMS.settle|0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===1 && PSIZE[PROOT[i]] < minf && ptick-NBORN[PROOT[i]] > settle) killNode(i);
    else if(NLIVE[i]===2 && PSIZE[PROOT[i]]===0) freeNode(i);
  }
}

/* Candidates come from the frontier, never from the body. Sampling the body
   would make a large plant spend its turns on interior nodes that cannot grow,
   and the size distribution would then be set by that accident rather than by
   anything chosen. */
function plantsStep(){
  if(!plantsOn) return;
  ptick++;
  reap();
  if(PARAMS.sweep>0 && ptick%(PARAMS.sweep|0)===0){ pruneFragments(); census(); }

  /* Attempts used to be drawn from one global frontier, which made a form's
     growth proportional to how much of the world it already held — so the
     seeding lottery decided the final shares and the sea stayed empty beside
     perfectly good shelf. One attempt per body per turn instead: a small
     population then expands at the same rate per body as a large one and can
     actually converge on its niche. Capped, so cost stays bounded. */
  const cap = PARAMS.grow|0, perBody = PARAMS.perbody > 0;
  let tried=0, guard=cap*8;
  while(tried < cap && guard-- > 0 && frontN > 0 && (liveN+woodN) < PMAX){
    const fi = (prnd()*frontN)|0;
    const ni = PFRONT[fi];
    if(NLIVE[ni]!==1){ retire(fi); continue; }
    /* Sampling the frontier is already the fair rule the brief was reaching
       for: the frontier is the perimeter, so a body's growth follows its
       number of tips rather than its area, and per unit area it still slows
       as 1/r. Strict one-bud-per-body only made sense while fragmentation was
       minting plants by the thousand; with nothing splitting, forty plants
       taking one node a turn cannot fill a planet. */
    if(perBody){
      const body = PROOT[ni];
      if(CSTAMP[body] === ptick) continue;
      CSTAMP[body] = ptick;
    }
    tried++;
    /* Fragmentation used to found new bodies as a side effect of falling
       apart. Now that nothing falls apart, nothing is founded either, and the
       population can only decline — so the spore the brief asked for is no
       longer optional. Rare enough that an arrival still reads as an event. */
    if(prnd() < PARAMS.spore){ spore(ni); continue; }
    if(bud(ni)){
      NFAIL[ni] = 0;
      if(NKID[ni] >= PARAMS.kids || prnd() > GENE[ni*G+G_BRANCH]) retire(fi);
    } else if(++NFAIL[ni] >= PARAMS.tries) retire(fi);
  }
}

function plantsSeed(){
  if(!plantsOn) return;
  /* Uniformly random genomes normalise to near-generalists, and a world of
     identical generalists gives selection nothing to work on. Tip each seed
     toward one of the five so there is variation on the board at tick zero. */
  for(let n=0, guard=0; n<PARAMS.seeds && guard<80000; guard++){
    const u=prnd()*2-1, ph=prnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    const x=r*Math.cos(ph), y=u, z=r*Math.sin(ph);
    let ax=-Math.sin(ph), ay=0, az=Math.cos(ph);
    const th=prnd()*Math.PI*2, cc=Math.cos(th), ss=Math.sin(th);
    const bx=y*az-z*ay, by=z*ax-x*az, bz=x*ay-y*ax;
    let hx=ax*cc+bx*ss, hy=ay*cc+by*ss, hz=az*cc+bz*ss;
    const dp=hx*x+hy*y+hz*z; hx-=x*dp; hy-=y*dp; hz-=z*dp;
    const l=1/Math.hypot(hx,hy,hz);
    const i = addNode(x,y,z,hx*l,hy*l,hz*l,-1,-1,0);
    const o = i*G, fav = (prnd()*5)|0;
    for(let g=0;g<5;g++) GENE[o+g] = 0.25+prnd()*0.5;
    GENE[o+fav] += 2.2+prnd()*1.6;
    normalise(o);
    if(fitOf(o, cellAt(x,y,z)) < PARAMS.viable){ killNode(i); continue; }
    NLIFE[i]=Math.max(PARAMS.hostile|0,
      (PARAMS.life*fitOf(o,cellAt(x,y,z))*(1.40-0.80*GENE[o+G_PACE]))|0);
    n++;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   3.  WebGL
   ══════════════════════════════════════════════════════════════════════ */
const canvas=document.getElementById("gl");
const gl = canvas.getContext("webgl2",{antialias:true,alpha:false,powerPreference:"high-performance"});
if(!gl){ document.getElementById("fail").style.display="flex";
         document.getElementById("splash").style.display="none"; return; }

function sh(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s)+"\n"+src.split("\n").map((l,i)=>(i+1)+": "+l).join("\n"));
  return s;
}
function prog(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name.replace("[0]","");
    u[nm]=gl.getUniformLocation(p,nm); }
  p.u=u; return p;
}

const GLSL_NOISE = `
vec3 hash33(vec3 p){
  p = fract(p*vec3(0.1031,0.1030,0.0973));
  p += dot(p, p.yxz+33.33);
  vec3 g = fract((p.xxy+p.yxx)*p.zyx)*2.0-1.0;
  /* unit-length gradients: without this the cube diagonals dominate and
     the noise shows a herringbone lattice */
  return g*inversesqrt(dot(g,g)+1e-5);
}
vec3 hash33r(vec3 p){
  p = fract(p*vec3(0.1031,0.1030,0.0973));
  p += dot(p, p.yxz+33.33);
  return fract((p.xxy+p.yxx)*p.zyx);
}
float gnoise(vec3 p){
  vec3 i=floor(p), f=fract(p);
  vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash33(i+vec3(0,0,0)),f-vec3(0,0,0)),
                     dot(hash33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash33(i+vec3(0,1,0)),f-vec3(0,1,0)),
                     dot(hash33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash33(i+vec3(0,0,1)),f-vec3(0,0,1)),
                     dot(hash33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash33(i+vec3(0,1,1)),f-vec3(0,1,1)),
                     dot(hash33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z)*1.32;
}
/* rotate between octaves so the lattices never line up */
const mat3 NR = mat3( 0.00, 0.80, 0.60, -0.80, 0.36,-0.48, -0.60,-0.48, 0.64);
float fbm2(vec3 p){
  float s=0.6667*gnoise(p); p=NR*p*2.07+11.1;
  return s+0.3333*gnoise(p);
}
float fbm3(vec3 p){
  float s=0.5333*gnoise(p); p=NR*p*2.03+11.1;
  s+=0.2667*gnoise(p);      p=NR*p*2.11-7.3;
  return s+0.1333*gnoise(p);
}
float fbm5(vec3 p){
  float a=0.5,s=0.0;
  for(int i=0;i<5;i++){ s+=a*gnoise(p); p=NR*p*2.04+vec3(5.2,1.3,9.7); a*=0.5; }
  return s;
}`;

/* ---------- sphere geometry ---------- */
function makeSphere(seg,rings){
  const pos=[],idx=[];
  for(let j=0;j<=rings;j++){
    const v=j/rings, th=v*Math.PI, st=Math.sin(th), ct=Math.cos(th);
    for(let i=0;i<=seg;i++){

   Held in tight against the planet the ring reads as small, because this world
   already looks Earth-sized and a close ring borrows that scale. Standing it
   further off buys back the sense that both are enormous. It costs framing:
   fitDist puts the edge of a square window at about 1.3 radii, so seen exactly
   edge-on in a narrow window the ring can fall outside the picture entirely.
   Worth it — in any ordinary landscape window it is all there, and the shape
   is what sells the size. The mesh is only a proxy for the rasteriser:
   every fragment works out its own radius from the view ray, so neither these
   radii nor the thickness the vertex shader gives it ever show in the picture.
   What they do decide is where fragments get generated at all. */

  /* a frame spanning the ring plane; any pair perpendicular to the axis does */
  const U = (()=>{ const a = Math.abs(POLE[1])<0.9 ? [0,1,0] : [1,0,0];
    const c = [POLE[1]*a[2]-POLE[2]*a[1], POLE[2]*a[0]-POLE[0]*a[2], POLE[0]*a[1]-POLE[1]*a[0]];
    const l = 1/Math.hypot(c[0],c[1],c[2]); return [c[0]*l,c[1]*l,c[2]*l]; })();
  const W = [POLE[1]*U[2]-POLE[2]*U[1], POLE[2]*U[0]-POLE[0]*U[2], POLE[0]*U[1]-POLE[1]*U[0]];
  const pos=[], side=[], idx=[];
  /* four rings of vertices: inner and outer, each on both faces of the slab */
  for(const rs of [[r0,1],[r1,1],[r0,-1],[r1,-1]]){
    for(let i=0;i<=seg;i++){
      const th=i/seg*Math.PI*2, c=Math.cos(th), s=Math.sin(th);
      pos.push((U[0]*c+W[0]*s)*rs[0], (U[1]*c+W[1]*s)*rs[0], (U[2]*c+W[2]*s)*rs[0]);
      side.push(rs[1]);
    }

  const N=seg+1;
  /* counter-clockwise seen from outside each of the four faces, or back-face
     culling renders the far side of the slab and the shading doubles up */
  for(let i=0;i<seg;i++){
    const it=i, ot=N+i, ib=2*N+i, ob=3*N+i;
    idx.push(it, ot, ot+1,   it, ot+1, it+1);      // face toward the north pole
    idx.push(ib, ib+1, ob+1, ib, ob+1, ob);        // face toward the south pole
    idx.push(ot, ob, ob+1,   ot, ob+1, ot+1);      // outer rim
    idx.push(it, ib+1, ib,   it, it+1, ib+1);      // inner rim

const GLSL_RING = `
uniform vec3 uRingN;        /* ring plane normal — the axis, without the spin */
uniform float uRingFade;
const float RR0 = ${RING_R0}, RR1 = ${RING_R1};

/* Optical depth across the ring as a function of radius. One profile serves
   both the ring and the shadow it throws, so a faint ring can never cast a
   strong band. pw is how much radius one pixel spans: structure finer than
   that is faded to its own mean rather than left to alias, which is the whole
   difference between a ring that looks expensive and one that shimmers. The
   profile reaches zero at both edges, so the rim of the proxy mesh carries no
   density and cannot draw a hard line of its own. */
float ringTau(float r, float pw){
  float u  = (r - RR0)/(RR1 - RR0);
  if(u < 0.0 || u > 1.0) return 0.0;
  float du = pw/(RR1 - RR0);

  /* The edges soften with the footprint too, not just the banding inside them.
     The shadow is sampled with a wide penumbra, and if only the fine structure
     washed out the band would still land with cut edges. */
  float env  = smoothstep(0.0, 0.14 + du*1.7, u)*(1.0 - smoothstep(1.0 - (0.22 + du*1.7), 1.0, u));
  float fine = 1.0 - smoothstep(0.012, 0.055, du);
  float band = 1.0 + 0.26*fine*sin(u*15.0 + 0.6);
  float gapF = 1.0 - smoothstep(0.020, 0.075, du);
  float gx   = (u - 0.63)/0.040;
  float gap  = 1.0 - 0.90*gapF*exp(-gx*gx);
  /* Low enough that the planet shows through the near half at any ordinary
     angle. Because the slant term below divides by the view angle, a value
     that reads as translucent face-on still closes up into a solid line
     edge-on, which is what a ring actually does. */
  return env*band*gap*0.155;
}

/* How much sunlight still reaches P after crossing the ring plane. Sunlight
   hits the ring at an angle, so a shallow sun means a longer path through the
   same material and a darker band — and because the axis is tilted, that band
   migrates north and south across the year on its own. The crossing radius is
   found without branching so the derivative below is taken in uniform flow. */
float ringShade(vec3 P, vec3 L){
  float dN = dot(L, uRingN);
  float sd = max(abs(dN), 0.02)*(dN < 0.0 ? -1.0 : 1.0);
  float t  = -dot(P, uRingN)/sd;
  vec3  X  = P + L*max(t, 0.0);
  float r  = length(X - uRingN*dot(X, uRingN));
  float pw = fwidth(r);
  if(t <= 0.0) return 1.0;
  /* The star is a disc, not a point, so the shadow carries a penumbra that
     widens with the distance it has been thrown. Without it the ring's fine
     banding survives all the way down to the ground and the shadow lands as
     a flat slab with cut edges instead of a band.
     The floor on dN matters more. Twice a year the sun crosses the ring plane,
     and there the sunlight's path through the ring runs to infinity: divide by
     it honestly and the band saturates into a hard black stripe exactly at
     equinox. Real ring shadows do sharpen then; a coarse grid and a thin ring
     make it read as a rendering fault instead. Capped, and capped again on the
     way out so the ring can never take more than a third of the daylight. */
  float tau = ringTau(r, pw + 0.05*t)/max(abs(dN), 0.19);
  return 1.0 - uRingFade*0.34*(1.0 - exp(-tau*0.85));
}`;
