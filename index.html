  wx[0]=-0.5*x3+x2-0.5*f.x;  wx[1]= 1.5*x3-2.5*x2+1.0;
  wx[2]=-1.5*x3+2.0*x2+0.5*f.x; wx[3]= 0.5*x3-0.5*x2;
  dx[0]=-1.5*x2+2.0*f.x-0.5; dx[1]= 4.5*x2-5.0*f.x;
  dx[2]=-4.5*x2+4.0*f.x+0.5; dx[3]= 1.5*x2-f.x;
  wy[0]=-0.5*y3+y2-0.5*f.y;  wy[1]= 1.5*y3-2.5*y2+1.0;
  wy[2]=-1.5*y3+2.0*y2+0.5*f.y; wy[3]= 0.5*y3-0.5*y2;
  dy[0]=-1.5*y2+2.0*f.y-0.5; dy[1]= 4.5*y2-5.0*f.y;
  dy[2]=-4.5*y2+4.0*f.y+0.5; dy[3]= 1.5*y2-f.y;

  float v=0.0, gx=0.0, gy=0.0;
  for(int b=0;b<4;b++){
    int yy = int(clamp(i.y-1.0+float(b), 0.0, RES.y-1.0));
    float rv=0.0, rg=0.0;
    for(int a=0;a<4;a++){
      int xx = int(mod(i.x-1.0+float(a), RES.x));
      float h = max(texelFetch(uData, ivec2(xx,yy), 0).r, sea);
      rv += wx[a]*h;  rg += dx[a]*h;
    }
    v += wy[b]*rv;  gx += wy[b]*rg;  gy += dy[b]*rv;
  }
  return vec3(v, gx, gy);
}

/* the grid supplies the shape of the land; the shader only adds a
   small fractal crinkle, so coastlines stay organic instead of being
   overwhelmed by the noise lattice */
float crinkle(vec3 d){ return 0.021*fbm3(d*11.0) + 0.0115*fbm2(d*31.0); }
float heightOf(vec3 d){ return fetchSmooth(d).r + crinkle(d); }

void main(){
  vec3 d = normalize(vObj);
  vec4 dat = dataAt(d);
  float moist = dat.a;
  float h0 = dat.r + crinkle(d);

  if(uDebug==1){ o=vec4(vec3(step(uSea,h0)),1.0); return; }
  if(uDebug==2){ o=vec4(vec3(step(uSea,dat.r)),1.0); return; }
  if(uDebug==3){ o=vec4(vec3(fract(dat.r*14.0)),1.0); return; }

  /* How much of the sphere one pixel covers. Detail finer than this cannot
     be resolved and aliases into moire instead — which is what produced
     the hatching across mountain belts in the twilight band. The fine
     octaves below fade out using these. */
  float pw = max(length(dFdx(d)), length(dFdy(d))) + 1e-7;
  float fadeA = 1.0 - smoothstep(0.006, 0.048, pw);
  float fadeB = 1.0 - smoothstep(0.003, 0.030, pw);

  /* Local tangent frame, always the lat/lon one so it agrees with the
     analytic derivatives below. It must not switch basis at high latitude:
     doing so rotated the relief direction discontinuously and drew a hard
     circle around each pole. */
  vec3 t1 = cross(vec3(0.0,1.0,0.0), d);
  float t1l = length(t1);
  t1 = t1l > 1e-4 ? t1/t1l : vec3(1.0,0.0,0.0);
  vec3 t2 = cross(d,t1);

  /* macro relief: differentiate the smooth grid over roughly one cell,
     which keeps the finite difference free of aliasing */
  /* true surface gradient, in units of elevation per radian of arc.
     t1 points west and t2 points south, hence the signs. */
  vec3 hcr = heightCR(d, uSea);
  float cosLat = sqrt(max(1.0-d.y*d.y, 0.0));
  /* smooth floor, so the longitude scale has no kink near the poles */
  float sLon = (6.28318530718/RES.x)*sqrt(cosLat*cosLat + 0.020);
  float sLat = 3.14159265359/RES.y;
  vec2 gRaw = vec2(-hcr.y/sLon, hcr.z/sLat);
  float gm = length(gRaw);
  /* Saturating slope, and capped low. Seen from orbit even a great range
     is a faint shading gradient — a real planet has nothing that reads as
     a black gash. This tops out near 13 degrees of tilt however steep the
     ground actually gets. */
  vec2 g = gm>1e-5 ? (gRaw/gm)*(gm*0.30/(1.0+gm*0.30))*0.245 : vec2(0.0);

  float land = h0-uSea;
  float isLand = step(0.0, land);
  float steep = smoothstep(2.6, 11.5, gm);

  /* Read vegetation and ice through a warped lens. Displacing *where* we
     sample, rather than nudging the value, is what turns a smooth ice
     margin into a ragged one with peninsulas and stranded floes. */
  /* relief fades out as the land meets the sea, so beaches stay flat */
  float shoreFade = smoothstep(0.0, 0.085, land);

  float wa = fbm2(d*7.0), wb = fbm2(d*7.0+vec3(19.3,4.1,-7.7));
  vec4 datW = fetchSmooth(normalize(d + (t1*wa + t2*wb)*0.075));
  float veg  = datW.g;
  float snow = datW.b;

  /* approximate temperature, matching the simulation, for tinting */
  float lat = asin(clamp(d.y,-1.0,1.0));
  float c = max(0.0, cos(lat - uSolarLat*mix(0.35,1.0,isLand)));
  float cp = pow(c,0.85);
  float T = -30.0 + 62.0*cp - max(0.0,land)*52.0 + uGT*(0.45+1.25*(1.0-cp)) - snow*4.2;

  /* ---------------- albedo ---------------- */
  vec3 albedo; float gloss;
  float micro  = fbm3(d*30.0)*0.5+0.5;
  /* fractal wobble on the snow line, so no ice edge is ever a clean arc */
  float snowEdge = snow + 0.105*fbm2(d*14.0) + 0.070*fbm2(d*30.0) + 0.030*fadeA*fbm2(d*66.0);
  float micro2 = (0.70*gnoise(d*40.0) + 0.30*fadeA*gnoise(d*84.0+3.9))*0.5+0.5;

  if(land < 0.0){
    float depth = clamp(-land*2.4, 0.0, 1.0);
    vec3 shallow = vec3(0.115,0.400,0.435);
    vec3 midw    = vec3(0.040,0.155,0.310);
    vec3 deep    = vec3(0.009,0.045,0.130);
    vec3 col = mix(shallow, midw, smoothstep(0.0,0.30,depth));
    col = mix(col, deep, smoothstep(0.26,0.85,depth));
    col *= 0.93+0.14*micro;
    float ice = smoothstep(0.34,0.72,snowEdge);
    vec3 iceCol = mix(vec3(0.70,0.79,0.86), vec3(0.94,0.97,1.0), micro);
    col = mix(col, iceCol, ice);
    albedo = col;
    gloss = 1.0-ice*0.95;
  } else {
    /* Barren ground is not one colour. A cold desert is grey-brown rock,
       frozen soil and gravel; a hot desert is sand. Keying both to the same
       sand meant melting snow uncovered the Sahara — so seasonal snow looked
       like it had been lying on nothing at all. */
    vec3 barrenCold = mix(vec3(0.430,0.408,0.356), vec3(0.338,0.318,0.274), micro);
    vec3 barrenCool = mix(vec3(0.548,0.496,0.376), vec3(0.444,0.400,0.302), micro);
    vec3 barrenWarm = mix(vec3(0.800,0.690,0.470), vec3(0.650,0.500,0.320), micro);
    vec3 sand = mix(barrenCold, barrenCool, smoothstep(-9.0, 3.0, T));
    sand      = mix(sand,       barrenWarm, smoothstep(5.0, 19.0, T));

    vec3 steppeCold = mix(vec3(0.436,0.428,0.336), vec3(0.352,0.344,0.272), micro);
    vec3 steppeWarm = mix(vec3(0.600,0.560,0.340), vec3(0.500,0.490,0.290), micro);
    vec3 steppe = mix(steppeCold, steppeWarm, smoothstep(-2.0, 14.0, T));
    vec3 grass  = mix(vec3(0.36,0.49,0.21), vec3(0.29,0.42,0.17), micro);
    vec3 forest = mix(vec3(0.155,0.325,0.145), vec3(0.110,0.250,0.118), micro);
    vec3 jungle = mix(vec3(0.095,0.280,0.110), vec3(0.070,0.210,0.092), micro);
    vec3 taiga  = mix(vec3(0.130,0.245,0.180), vec3(0.098,0.188,0.148), micro);
    vec3 tundra = mix(vec3(0.445,0.400,0.310), vec3(0.352,0.315,0.246), micro);
    vec3 rock   = mix(vec3(0.470,0.428,0.372), vec3(0.392,0.352,0.303), micro2);

    vec3 col = mix(sand, steppe, smoothstep(0.02,0.24,veg));
    col = mix(col, grass,  smoothstep(0.20,0.48,veg));
    col = mix(col, forest, smoothstep(0.44,0.74,veg));
    col = mix(col, jungle, smoothstep(0.74,0.96,veg)*smoothstep(16.0,24.0,T));
    col = mix(col, taiga,  (1.0-smoothstep(-3.0,8.0,T))*smoothstep(0.25,0.6,veg));
    col = mix(col, tundra, (1.0-smoothstep(-13.0,-1.0,T))*(1.0-veg*0.55)*0.60);

    /* beaches: narrow, and broken up so coasts are not outlined */
    float beach = (1.0-smoothstep(0.0,0.013,land))*(0.35+0.80*micro);
    col = mix(col, vec3(0.74,0.68,0.53), clamp(beach,0.0,1.0));

    /* exposed rock, but only where ground is truly steep or truly high;
       dramatic cliffs exist on real worlds and they are rare */
    col = mix(col, rock, clamp(steep*0.42 + smoothstep(0.44,0.82,land)*0.50, 0.0, 0.72));

    /* snow, favouring flat ground */
    float sn = smoothstep(0.30,0.52,snowEdge)*(1.0-steep*0.30);
    col = mix(col, mix(vec3(0.86,0.90,0.95), vec3(0.97,0.99,1.0), micro), sn);

    albedo = col;
    gloss = 0.06;
  }

  /* Plants go into the albedo, not over the finished picture, so everything
     downstream treats them as ground. */
  float pu = atan(d.z,d.x)*0.15915494+0.5;
  float pv = 0.5-asin(clamp(d.y,-1.0,1.0))*0.31830989;
  /* u jumps by a whole turn across the back meridian. Left alone the hardware
     sees an enormous derivative there, drops to the coarsest mip, and draws a
     blurred line from pole to pole. Take the derivatives by hand and subtract
     the wrap before asking for the sample. */
  vec2 pdx = vec2(dFdx(pu), dFdx(pv)), pdy = vec2(dFdy(pu), dFdy(pv));
  pdx.x -= round(pdx.x);  pdy.x -= round(pdy.x);
  vec4 pl = textureGrad(uPlant, vec2(pu,pv), pdx, pdy);
  albedo = mix(albedo, pl.rgb, pl.a);
  gloss  = mix(gloss, 0.02, pl.a);

  /* ---------------- normal ----------------
     micro relief comes from a noise *vector*, not a finite difference,
     so there is no sampling lattice to alias against               */
  vec3 Nw = normalize(uRot*d);
  vec3 V  = normalize(uCam - vWorld);
  float graze = smoothstep(0.03, 0.42, dot(Nw,V));

  vec3 nObj;
  if(land < 0.0){
    vec3 wv = vec3(gnoise(d*66.0+vec3(uT*0.010,0.0,4.0)),
                   gnoise(d*66.0+vec3(0.0,uT*0.010,19.0)),
                   gnoise(d*66.0+vec3(7.0,3.0,uT*0.010)));
    nObj = normalize(d + wv*(0.013*fadeB));
  } else {
    vec3 m1 = vec3(gnoise(d*22.0+vec3(3.1,0.0,0.0)),
                   gnoise(d*22.0+vec3(0.0,17.7,0.0)),
                   gnoise(d*22.0+vec3(0.0,0.0,-9.4)));
    vec3 m2 = fadeA*vec3(gnoise(d*46.0+vec3(41.0,0.0,0.0)),
                         gnoise(d*46.0+vec3(0.0,-5.0,0.0)),
                         gnoise(d*46.0+vec3(0.0,0.0,23.0)));
    float amt = (0.30 + 0.55*steep)*graze;
    nObj = normalize(d - (t1*g.x + t2*g.y)*shoreFade
                       + (m1*0.038 + m2*0.016)*amt);
  }

  vec3 N = normalize(uRot*nObj);
  vec3 L = uSun;

  float ndlG = dot(Nw,L);          // true surface, no relief
  float ndlB = dot(N,L);           // with relief

  /* Relief works by tilting the normal, which is honest in open daylight
     but wrong at the terminator: with the sun almost tangent, a few
     degrees of tilt throws a whole region into shadow, and the coarse
     grid beneath the relief shows through as blotches. So the terminator
     is decided by geometry alone, and relief fades in as the sun climbs. */
  float reliefMix = smoothstep(0.02, 0.34, ndlG);
  float ndl  = mix(ndlG, ndlB, reliefMix);
  float ndlS = ndlG;
  float lam  = smoothstep(-0.14, 0.26, ndl);

  vec3 sunHigh = vec3(1.00,0.975,0.940);
  vec3 sunLow  = vec3(1.00,0.560,0.300);
  vec3 sunCol  = mix(sunLow, sunHigh, smoothstep(0.0,0.40,ndlS));

  /* The ring blocks direct sun only — skylight still reaches the band, so it
     reads as a soft dark stripe rather than a hole punched in the day side. */
  float rShade = ringShade(vWorld, L);

  vec3 col = albedo*sunCol*lam*1.14*rShade;

  vec3 Hv = normalize(L+V);
  vec3  Ns   = normalize(mix(Nw, N, reliefMix));
  float spec = pow(max(dot(Ns,Hv),0.0), mix(24.0,120.0,gloss))*gloss*lam;
  col += sunCol*spec*0.55*rShade;

  float rim = pow(1.0-max(dot(Nw,V),0.0), 3.2);
  col += vec3(0.34,0.54,0.95)*rim*lam*0.55;
  col += vec3(1.00,0.45,0.20)*rim*(1.0-smoothstep(-0.10,0.30,ndlS))*smoothstep(-0.35,0.05,ndlS)*0.75;

  /* skylight: scattered blue from the atmosphere itself, keyed to the
     geometric normal so relief never punches a hole to pure black */
  col += albedo*vec3(0.115,0.135,0.170)*smoothstep(-0.05,0.28,ndlS);
  /* Night side. Starlight and airglow alone leave it at ink, and the cloud
     deck — which carries its own floor — ends up the brightest thing on the
     dark half, so weather reads and the world underneath does not. Lift the
     ground until it sits above the clouds again.
     Ambient by itself would be legible but shapeless, so the lift carries a
     directional term aimed along the view: slopes still shade and coastlines
     still turn. The graze term drops it back to the geometric normal at the
     limb —
     edge-on, a tilted normal shows the grid rather than the ground, which is
     the same reason the terminator ignores relief. */
  float night = 1.0 - lam;
  float head  = max(dot(normalize(mix(Nw, N, graze)), V), 0.0);
  col += albedo*(vec3(0.082,0.096,0.130) + vec3(0.125,0.138,0.164)*head)*night;

  col = col/(1.0+col*0.32);
  o = vec4(col,1.0);
}`);

/* ---------- clouds ---------- */
const cloudProg = prog(VS_SPH, `#version 300 es
precision highp float;
in vec3 vObj; in vec3 vWorld;
out vec4 o;
uniform sampler2D uData;
uniform mat3 uRot;
uniform vec3 uSun, uCam;
uniform float uT, uDrift, uFade;
${GLSL_NOISE}
${GLSL_RING}
const vec2 RES = vec2(${GW}.0,${GH}.0);
float moistAt(vec3 d){
  vec2 uv = vec2(atan(d.z,d.x)*0.15915494+0.5, 0.5-asin(clamp(d.y,-1.0,1.0))*0.31830989);
  vec2 st = uv*RES-0.5; vec2 i=floor(st), f=fract(st); f=f*f*(3.0-2.0*f);
  int x0=int(mod(i.x,RES.x)), x1=int(mod(i.x+1.0,RES.x));
  int y0=int(clamp(i.y,0.0,RES.y-1.0)), y1=int(clamp(i.y+1.0,0.0,RES.y-1.0));
  float a=texelFetch(uData,ivec2(x0,y0),0).a, b=texelFetch(uData,ivec2(x1,y0),0).a;
  float c=texelFetch(uData,ivec2(x0,y1),0).a, e=texelFetch(uData,ivec2(x1,y1),0).a;
  return mix(mix(a,b,f.x), mix(c,e,f.x), f.y);
}
void main(){
  vec3 d = normalize(vObj);
  /* Taken before the discard below: ringShade differentiates, and a derivative
     is only defined while the whole quad is still alive. */
  float rShade = ringShade(vWorld, uSun);

  float ca=cos(uDrift), sa=sin(uDrift);
  vec3 dq = vec3(d.x*ca+d.z*sa, d.y, -d.x*sa+d.z*ca);
  float moist = moistAt(dq);

  /* stretch the noise along latitude a little so weather forms bands */
  vec3 q = vec3(dq.x, dq.y*1.9, dq.z)*4.0 + vec3(0.0, uT*0.0035, 0.0);
  float n = fbm5(q)*0.5+0.5;
  n = mix(n, fbm3(dq*11.0+uT*0.009)*0.5+0.5, 0.38);

  float lat = asin(clamp(d.y,-1.0,1.0));
  float bands = 0.55 + 0.45*cos(lat*6.0);
  float cover = clamp((moist-0.22)*1.25*bands, 0.0, 1.0);
  float thr = 0.635 - 0.235*cover;
  float dens = smoothstep(thr, thr+0.115, n);
  if(dens <= 0.004) discard;

  vec3 Nw = normalize(uRot*d);
  float ndl = dot(Nw, uSun);
  float lam = smoothstep(-0.22, 0.22, ndl);
  vec3 warm = vec3(1.00,0.62,0.40);
  vec3 lit  = mix(warm, vec3(1.0,0.99,0.98), smoothstep(0.0,0.38,ndl));
  /* the shadow has to cross the weather too, or the band stops dead at every
     cloud edge and reads as a rendering fault */
  vec3 col = lit*(0.05+1.10*lam*rShade) + vec3(0.020,0.028,0.050)*(1.0-lam);

  /* A wide, gentle limb fade so the cloud shell never shows an edge, and a
     single global fade so zooming right in dissolves the whole cloud deck
     instead of cutting a circle through it. */
  vec3 V = normalize(uCam-vWorld);
  float edge = smoothstep(-0.10, 0.42, dot(Nw,V));
  o = vec4(col, dens*0.86*edge*uFade);
}`);

/* ---------- ring ---------- */
const VS_RING=`#version 300 es
layout(location=0) in vec3 aPos;    /* position in the ring plane */
layout(location=1) in float aSide;  /* which face of the slab, -1 or +1 */
uniform mat4 uVP; uniform vec3 uCam, uRingN; uniform float uPixel;
out vec3 vWorld;
out float vOff;    /* how far this vertex was pushed, in pixels */
void main(){
  /* A ring is flat, so edge-on it has no thickness for the rasteriser to
     cover and breaks into crawling dashes — exactly the view that is supposed
     to tell you where you are. Give the slab its thickness in *pixels* rather
     than in world units: invisible face-on, always a couple of pixels edge-on,
     and unchanged by resolution or by the adaptive DPR. */
  float px = uPixel*distance(uCam, aPos);
  vOff   = aSide*1.7;
  vWorld = aPos + uRingN*(vOff*px);
  gl_Position = uVP*vec4(vWorld,1.0);
}`;

const ringProg = prog(VS_RING, `#version 300 es
precision highp float;
in vec3 vWorld;
in float vOff;
out vec4 o;
uniform vec3 uSun, uCam;
${GLSL_RING}
void main(){
  vec3 rd = normalize(vWorld - uCam);
  float cN = dot(rd, uRingN);

  /* Where does this sightline cross the ring, and at what radius? Nearly
     edge-on the crossing runs off to infinity, so fall back to the ray's
     closest approach to the axis — the radius it spends most of its path
     beside. The two agree everywhere in between, so the blend is seamless. */
  float sc = max(abs(cN), 1e-4)*(cN < 0.0 ? -1.0 : 1.0);
  vec3  Pc = uCam + rd*max(-dot(uCam, uRingN)/sc, 0.0);
  vec3  Pg = uCam + rd*max(-dot(uCam, rd), 0.0);
  float rC = length(Pc - uRingN*dot(Pc, uRingN));
  float rG = length(Pg - uRingN*dot(Pg, uRingN));
  float w  = smoothstep(0.015, 0.10, abs(cN));
  float r  = mix(rG, rC, w);
  vec3  P  = mix(Pg, Pc, w);

  float pw  = fwidth(r);
  float tau = ringTau(r, pw);

  /* A grazing sightline crosses far more material for the same patch of
     screen. Extinction rather than a plain multiply, so it saturates into a
     clean bright line instead of blowing out. */
  /* Face-on the slab's cap covers the ring and its 1.7px push is along the
     line of sight, so it costs nothing. Edge-on the cap is degenerate and the
     rims do the covering, and there the push is across the screen — left
     alone it would draw a hard-edged strip 3.4px wide. Taper across it, but
     only once the ring is thin enough for the rims to matter, or the taper
     would eat the cap at every ordinary angle. */
  float sinv = sqrt(max(1.0 - cN*cN, 0.0));
  float thin = 1.0 - smoothstep(0.05, 0.22, abs(cN));
  float cov  = mix(1.0, 1.0 - smoothstep(0.25, 1.05, abs(vOff)*sinv), thin);

  float a = (1.0 - exp(-tau*1.25/max(abs(cN), 0.045)))*uRingFade*cov;
  if(a <= 0.003) discard;

  /* The planet's shadow: one ray-sphere test, and the single thing that makes
     a ring read as something in orbit rather than a decal on the sky. */
  float sL   = dot(P, uSun);
  float perp = sqrt(max(dot(P,P) - sL*sL, 0.0));
  float lit  = sL < 0.0 ? smoothstep(0.990, 1.13, perp) : 1.0;

  float obliq = abs(dot(uSun, uRingN));   /* how squarely the sun strikes it */
  /* From the sun's side of the plane we see reflected light; from the other,
     only what filters through */
  float face  = smoothstep(-0.10, 0.10, -cN*dot(uSun, uRingN));

  /* Rings brighten hard when backlit, which lands exactly as the star passes
     behind the planet. Restrained, so it lifts that moment instead of
     competing with the limb, which already owns it. */
  float fwd = pow(max(dot(rd, uSun), 0.0), 9.0);

  /* A ring is particles, not a surface: each one is lit the same however
     obliquely the sheet is struck, so brightness leans only gently on the
     sun's angle. Keyed hard to it, the ring would go murky whenever the
     season brought the sun back toward the ring plane — which is most of the
     time, since the sun never rises more than the axial tilt above it. */
  vec3 col = mix(vec3(0.62,0.66,0.79), vec3(0.95,0.91,0.83), obliq)
           * (0.46 + 0.38*obliq) * mix(0.32, 1.0, face);
  col += vec3(1.00,0.94,0.84)*fwd*(0.20 + 0.42*obliq);
  col *= mix(0.09, 1.0, lit);

  o = vec4(col, a);
}`);

/* ---------- atmosphere shell ---------- */
const atmoProg = prog(VS_SPH, `#version 300 es
precision highp float;
in vec3 vObj; in vec3 vWorld;
out vec4 o;
uniform vec3 uSun, uCam; uniform mat3 uRot; uniform float uAtmR;
void main(){
  vec3 rd = normalize(vWorld-uCam);
  /* shade the point where this ray grazes closest to the planet, not the
     far wall of the shell: that is the air the light is actually passing
     through, and it makes the terminator glow sit where it belongs */
  vec3 Pc = uCam + rd*max(0.0, -dot(uCam, rd));
  float b = length(Pc);
  vec3 P = Pc/max(b,1e-4);

  /* bright close to the surface, with a long soft halo beyond it */
  float t = clamp((b-0.995)/(uAtmR-0.995), 0.0, 1.0);
  float g = exp(-t*5.0)*(1.0-t);

  /* A line of sight skimming the limb passes through a whole chord of air,
     not one point. Find the sunniest air anywhere along that chord — that
     is what decides how brightly this piece of limb glows. Without it the
     ring vanishes exactly when the star is behind the planet, which is the
     one time you most want to see it. */
  float L    = sqrt(max(0.0, uAtmR*uAtmR - b*b));
  float span = atan(L/max(b,1e-4));
  vec2  su   = vec2(dot(uSun,P), dot(uSun,rd));
  float m    = length(su);
  float pOpt = atan(su.y, su.x);
  float sunMax = m*cos(clamp(pOpt,-span,span) - pOpt);

  float sunT = dot(P, uSun);            // the air right at the horizon
  float lit  = smoothstep(-0.32, 0.02, sunMax);
  vec3 day   = vec3(0.40,0.64,0.98);
  vec3 dusk  = vec3(1.00,0.52,0.26);
  vec3 col   = mix(dusk, day, smoothstep(-0.04, 0.20, sunT));
  float i = g*lit*0.92;
  o = vec4(col*i, 1.0);
}`);

/* ══════════════════════════════════════════════════════════════════════
   4.  camera + interaction
   ══════════════════════════════════════════════════════════════════════ */
const FOVY = 42*Math.PI/180;
/* frame the planet so it never touches the edge of the window, whatever
   shape that window is */
function fitDist(){
  const asp = Math.max(0.2, canvas.width/Math.max(1,canvas.height));
  const vHalf = FOVY*0.5;
  const hHalf = Math.atan(Math.tan(vHalf)*asp);
  return 1.0/Math.sin(Math.min(vHalf,hHalf)*0.82);
}
const CAM = {yaw:1.42, pitch:0.26, dist:3.4, tDist:3.4, zoom:1.0};
let dragging=false, lastX=0, lastY=0;
let paused=false, speed=1;
const hud=document.getElementById("hud");

/* the interface is shown or hidden by a click on the world; it never
   disappears on a timer */
let hudShown=true;
function setHud(v){ hudShown=v; hud.classList.toggle("hidden", !v); }

const ICON_PAUSE='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.1" y="1.4" width="3" height="9.2" fill="currentColor"/><rect x="6.9" y="1.4" width="3" height="9.2" fill="currentColor"/></svg>';
const ICON_PLAY ='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 1.3 L10.4 6 L3.2 10.7 Z" fill="currentColor"/></svg>';
const ppBtn = document.getElementById("playpause");
function setPaused(v){
  paused = v;
  ppBtn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  ppBtn.setAttribute("aria-label", paused ? "play" : "pause");
  ppBtn.title = paused ? "play" : "pause";
}
setPaused(false);
ppBtn.addEventListener("click", e=>{ e.stopPropagation(); setPaused(!paused); });

/* ── input ─────────────────────────────────────────────────────────────
   One pointer orbits, two pinch to zoom. Every transition between those
   states re-baselines the deltas, because reusing a stale baseline when a
   second finger lands is exactly what made the planet jump at the start of
   a pinch. Pointers are tracked by id rather than assuming one at a time. */
const ptrs = new Map();
let mode = 0;                       // 0 idle · 1 orbit · 2 pinch
let pinchSpread = 0, pinchZoom0 = 1;
let cx0 = 0, cy0 = 0;               // pinch centroid baseline
let downX=0, downY=0, downT=0, travel=0, didPinch=false;

function centroid(){
  let x=0,y=0;
  for(const p of ptrs.values()){ x+=p.x; y+=p.y; }
  const k = ptrs.size || 1;
  return {x:x/k, y:y/k};
}
function spread(){
  const a = [...ptrs.values()];
  if(a.length < 2) return 0;
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}
function orbitBy(dx, dy){
  CAM.yaw   -= dx*0.0055;
  CAM.pitch  = clamp(CAM.pitch + dy*0.0055, -1.35, 1.35);
}
/* called whenever the number of pointers changes */
function rebase(){
  if(ptrs.size === 1){
    mode = 1;
    const p = ptrs.values().next().value;
    lastX = p.x; lastY = p.y;
  } else if(ptrs.size >= 2){
    mode = 2;
    pinchSpread = spread() || 1;
    pinchZoom0  = CAM.zoom;
    const c = centroid(); cx0 = c.x; cy0 = c.y;
  } else {
    mode = 0;
  }
  dragging = ptrs.size > 0;
  canvas.classList.toggle("dragging", dragging);
}

canvas.addEventListener("pointerdown",e=>{
  if(ptrs.size === 0){
    downX=e.clientX; downY=e.clientY; downT=performance.now();
    travel=0; didPinch=false;
  }
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size >= 2) didPinch = true;
  rebase();
  e.preventDefault();
},{passive:false});

/* on window, so a drag that leaves the canvas still tracks */
addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(mode === 1){
    travel += Math.abs(e.clientX-lastX) + Math.abs(e.clientY-lastY);
    orbitBy(e.clientX-lastX, e.clientY-lastY);
    lastX = e.clientX; lastY = e.clientY;
  } else if(mode === 2){
    const d = spread();
    if(d > 12 && pinchSpread > 12){
      /* fingers apart -> closer to the planet -> smaller camera distance */
      CAM.zoom  = clamp(pinchZoom0*(pinchSpread/d), 0.44, 2.6);
      CAM.tDist = fitDist()*CAM.zoom;
    }
    const c = centroid();
    orbitBy(c.x-cx0, c.y-cy0);
    cx0 = c.x; cy0 = c.y;
  }
},{passive:false});

function liftPointer(e){
  const rec = ptrs.get(e.pointerId);
  if(!rec) return;
  ptrs.delete(e.pointerId);
  const wasLast = ptrs.size === 0;
  rebase();
  /* Use the last position we tracked for this pointer, not the coordinates
     on the release event: some touch stacks report those as zero. Movement
     is the real test of tap-versus-drag; the time limit is generous so that
     a slow device cannot turn a tap into a non-event. */
  if(wasLast && !didPinch
     && performance.now()-downT < 1500
     && Math.hypot(rec.x-downX, rec.y-downY) < 12 && travel < 18){
    setHud(!hudShown);
  }
}
addEventListener("pointerup", liftPointer);
addEventListener("pointercancel", liftPointer);

/* If a release is ever lost — the OS claims the gesture, the user switches
   apps mid-pinch — the tracked pointers would stick and input would stay
   jammed. Drop them whenever we lose the window. */
function clearPointers(){ if(ptrs.size){ ptrs.clear(); rebase(); } }
addEventListener("blur", clearPointers);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) clearPointers(); });

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  CAM.zoom = clamp(CAM.zoom*Math.exp(e.deltaY*0.0011), 0.44, 2.6);
  CAM.tDist = fitDist()*CAM.zoom;
},{passive:false});

/* Belt and braces against the browser zooming the whole page: trackpad
   pinch arrives as ctrl+wheel, and Safari sends its own gesture events. */
addEventListener("wheel", e=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
["gesturestart","gesturechange","gestureend"].forEach(t=>
  addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener("dblclick", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>{ if(e.target===canvas) e.preventDefault(); });

document.querySelectorAll(".sp").forEach(b=>{
  b.addEventListener("click",e=>{
    e.stopPropagation();
    speed=parseFloat(b.dataset.s);
    document.querySelectorAll(".sp").forEach(x=>x.classList.toggle("on",x===b));
    updateHUD();
  });
});
addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); setPaused(!paused); }
  else if(e.key==="h"||e.key==="H"){ setHud(!hudShown); }
  else if(e.key==="1"||e.key==="2"||e.key==="3"){
    const b=document.querySelectorAll(".sp")[+e.key-1]; if(b) b.click();
  }
});

/* ══════════════════════════════════════════════════════════════════════
   5.  HUD
   ══════════════════════════════════════════════════════════════════════ */
const BARDEF=[
  {k:"ocean", lab:"sea",    col:"#3b7fa8"},
  {k:"forest",lab:"forest", col:"#3f7a3a"},
  {k:"grass", lab:"grass",  col:"#8a9245"},
  {k:"desert",lab:"desert", col:"#c1a06a"},
  {k:"ice",   lab:"ice",    col:"#cfe0ea"}
];
const barsEl=document.getElementById("bars");
BARDEF.forEach(b=>{
  const d=document.createElement("div"); d.className="bar";
  d.innerHTML='<div class="val">--</div><div class="track"><div class="fill" style="background:'+b.col+'"></div></div><div class="lab">'+b.lab+'</div>';
  barsEl.appendChild(d); b.el=d;
});
/* Explicit units. "0:40" left it ambiguous whether that was 40 seconds or
   40 minutes, which is exactly the confusion the line was meant to remove. */
const dur = sec => {
  if(sec < 90) return Math.round(sec)+" sec";
  if(sec < 600) return (sec/60).toFixed(1).replace(/\.0$/,"")+" min";
  return Math.round(sec/60)+" min";
};
function updateHUD(){
  const t=Math.max(0, S.time-S.epoch0);
  const hh=Math.floor(t/3600), mm=Math.floor(t/60)%60, ss=Math.floor(t)%60;
  document.getElementById("clock").textContent =
    hh+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");

  const yr=Math.floor(t/YEAR)+1;
  const sl=S.solarLat;
  const season = sl >  TILT*0.35 ? "northern summer"
              : (sl < -TILT*0.35 ? "southern summer" : "equinox");
  const meanF = S.stats.temp*9/5 + 32;
  document.getElementById("clocklabel").textContent =
    "watching · year "+yr+" · "+season+" · mean "+Math.round(meanF)+"°F";

  /* The three processes are compressed by deliberately different factors,
     so there is no single geological clock to show. State the rates instead. */
  /* three short lines rather than one long one, so it survives a phone */
  document.getElementById("sc1").textContent =
    "a day is "+dur(DAY)+(speed>1 ? "   (×"+speed+" — rotation not sped up)" : "");
  document.getElementById("sc2").textContent = "a year is "+dur(YEAR/speed);
  document.getElementById("sc3").textContent = "continents change in "+dur(2400/speed);
  BARDEF.forEach(b=>{
    const v=(S.stats[b.k]||0);
    b.el.querySelector(".fill").style.width=Math.min(100,v*100/0.7)+"%";
    b.el.querySelector(".val").textContent=Math.round(v*100)+"%";
  });
}

/* ══════════════════════════════════════════════════════════════════════
   6.  boot: build a world that already has a history
   ══════════════════════════════════════════════════════════════════════ */
function seedWorld(){
  const __t0=performance.now();
  rebuildBand(0,GH,0);
  computeProx();
  for(let k=0;k<GN;k++){ F.moist[k]=0.5; F.veg[k]=0.25; F.snow[k]=0.0; }
  let settled=0;
  for(let n=0;n<440;n++){
    S.time += 8;
    if(n%14===0) rebuildBand(0,GH,S.time);
    if(n%4===0)  computeProx();
    stepFields(8);
    if(n>110){
      const st=S.stats;
      const dOfL = st.desert/Math.max(1e-6, st.land);
      const ok = Math.abs(st.ocean-TARGET.ocean) < 0.020 &&
                 Math.abs(st.ice  -TARGET.ice)   < 0.030 &&
                 Math.abs(dOfL-TARGET.desertOfLand) < 0.105;
      if(ok){ if(++settled > 18) break; } else settled = 0;
    }
  }
  S.epoch0 = S.time;
  window.__bootMs = Math.round(performance.now()-__t0);
  packTexture(); uploadData();
}

/* ══════════════════════════════════════════════════════════════════════
   7.  frame loop
   ══════════════════════════════════════════════════════════════════════ */
const mVP=M4(), mProj=M4(), mView=M4(), mInvVP=M4();
const rot3=new Float32Array(9);
/* The planet's axis is fixed in space. Seasons come from the sun riding up
   and down across the equator through the year — which gives the same
   advancing and retreating snow line as an orbit, without swinging the
   surface around or putting the world into phases. */
const SUNU = (()=>{ const v=[0.80,0.0,0.60];
  const dp=v[0]*POLE[0]+v[1]*POLE[1]+v[2]*POLE[2];
  const u=[v[0]-POLE[0]*dp, v[1]-POLE[1]*dp, v[2]-POLE[2]*dp];
  const l=1/Math.hypot(u[0],u[1],u[2]); return [u[0]*l,u[1]*l,u[2]*l]; })();
const SUN=[SUNU[0],SUNU[1],SUNU[2]];
function updateSun(){
  const c=Math.cos(S.solarLat), s=Math.sin(S.solarLat);
  SUN[0]=SUNU[0]*c+POLE[0]*s;
  SUN[1]=SUNU[1]*c+POLE[1]*s;
  SUN[2]=SUNU[2]*c+POLE[2]*s;
}

const DAY = 150;                 // real seconds per rotation
let spin=0, cloudDrift=0, frozen=false;
let dpr = Math.min(devicePixelRatio||1, 2);
let frameAcc=0, frameN=0;
let simAccum=0, bandCursor=0, hudAcc=0, DEBUG=0;
let last=performance.now();
let started=false;

function resize(){
  /* measure the canvas box itself rather than innerHeight: on phones the
     address bar makes innerHeight disagree with what is actually painted */
  const cw = canvas.clientWidth  || innerWidth;
  const ch = canvas.clientHeight || innerHeight;
  const w=Math.max(1,Math.round(cw*dpr)), h=Math.max(1,Math.round(ch*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
function relayout(){
  dpr=Math.min(devicePixelRatio||1,2); resize();
  CAM.tDist = fitDist()*CAM.zoom;
}
addEventListener("resize", relayout);
addEventListener("orientationchange", ()=>setTimeout(relayout,220));
if(window.visualViewport){
  visualViewport.addEventListener("resize", relayout);
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;

  /* adaptive resolution */
  frameAcc+=dt; frameN++;
  if(frameN>=45){
    const fps=frameN/frameAcc;
    if(fps<38 && dpr>0.75){ dpr=Math.max(0.75,dpr*0.82); resize(); }
    else if(fps>57 && dpr < Math.min(devicePixelRatio||1,2)-0.02){
      dpr=Math.min(Math.min(devicePixelRatio||1,2), dpr*1.08); resize(); }
    frameAcc=0; frameN=0;
  }

  if(!paused && !frozen){
    spin += dt*(Math.PI*2/DAY);
    cloudDrift += dt*(Math.PI*2/DAY)*0.06;
  }
  if(!paused) simAccum += dt;

  /* ---- world update at ~12 Hz, terrain rebuilt one band at a time ---- */
  if(simAccum >= 0.084 && !paused){
    const step = Math.min(simAccum*speed, 45);
    simAccum = 0;
    S.time += step;
    const rows = Math.ceil(GH/10);
    rebuildBand(bandCursor, Math.min(GH,bandCursor+rows), S.time);
    bandCursor = (bandCursor+rows) % GH;
    if(bandCursor===0) computeProx();
    stepFields(step);
    plantsStep();
    packTexture(); uploadData();
    hudAcc++; if(hudAcc>=4){ hudAcc=0; updateHUD(); }
  }
  renderPlants();

  updateSun();

  /* ---- camera ---- */
  CAM.dist += (CAM.tDist-CAM.dist)*Math.min(1,dt*3.0);
  /* a very slow breath, so the framing never feels locked off */
  const bob = 0.028*Math.sin(now*0.000012);
  const py=CAM.pitch+bob;
  const eye=[Math.cos(py)*Math.sin(CAM.yaw)*CAM.dist,
             Math.sin(py)*CAM.dist,
             Math.cos(py)*Math.cos(CAM.yaw)*CAM.dist];
  const W=canvas.width, Hh=canvas.height;
  perspective(mProj, FOVY, W/Hh, 0.35, 30);
  lookAt(mView, eye,[0,0,0],[0,1,0]);
  mul(mVP,mProj,mView); invert(mInvVP,mVP);

  /* planet orientation: a fixed tilted axis, spinning */
  const ca=Math.cos(AZ0), sa=Math.sin(AZ0), ct=Math.cos(TILT), st=Math.sin(TILT);
  const cs=Math.cos(spin), ss=Math.sin(spin);
  /* R = Ry(az) * Rz(tilt) * Ry(spin), column-major mat3 */
  const A=[ca,0,-sa, 0,1,0, sa,0,ca];
  const B=[ct,st,0, -st,ct,0, 0,0,1];
  const C=[cs,0,-ss, 0,1,0, ss,0,cs];
  const AB=m3(A,B), R=m3(AB,C);
  rot3.set(R);

  /* The ring is an orientation cue, so it is worth most where the whole
     ellipse is in frame and worth nothing close in, where it is just an arc
     sweeping past. Fade it out as you come down, hold it at full strength on
     the way out — and take its shadow with it, or the band would go on
     falling from a ring that is no longer there. */
  const ringFade = smoothstep(1.95, 3.05, CAM.dist);

  gl.viewport(0,0,W,Hh);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  /* background */
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  gl.useProgram(bgProg);
  gl.uniform2f(bgProg.u.uRes,W,Hh);
  gl.uniformMatrix4fv(bgProg.u.uInvVP,false,mInvVP);
  gl.uniform3fv(bgProg.u.uCam,eye);
  gl.uniform1f(bgProg.u.uT, now*0.001);
  gl.uniform3fv(bgProg.u.uSun, SUN);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,skyTex);
  gl.uniform1i(bgProg.u.uSky,1);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3);

  /* planet */
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.useProgram(planetProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,dataTex);
  gl.uniform1i(planetProg.u.uData,0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,plantTex);
  gl.uniform1i(planetProg.u.uPlant,2);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniformMatrix4fv(planetProg.u.uVP,false,mVP);
  gl.uniformMatrix3fv(planetProg.u.uRot,false,rot3);
  gl.uniform1f(planetProg.u.uScale,1.0);
  gl.uniform3fv(planetProg.u.uSun,SUN);
  gl.uniform3fv(planetProg.u.uCam,eye);
  gl.uniform1f(planetProg.u.uSea,S.seaLevel);
  gl.uniform1f(planetProg.u.uSolarLat,S.solarLat);
  gl.uniform1f(planetProg.u.uGT,S.globalTemp);
  gl.uniform1f(planetProg.u.uT, S.time);
  gl.uniform1i(planetProg.u.uDebug, DEBUG);
  gl.uniform3fv(planetProg.u.uRingN, POLE);
  gl.uniform1f(planetProg.u.uRingFade, ringFade);
  gl.bindVertexArray(sphVAO);
  gl.drawElements(gl.TRIANGLES,SPH.idx.length,gl.UNSIGNED_INT,0);

  /* clouds */
  gl.depthMask(false); gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(cloudProg);
  gl.uniform1i(cloudProg.u.uData,0);
  gl.uniformMatrix4fv(cloudProg.u.uVP,false,mVP);
  gl.uniformMatrix3fv(cloudProg.u.uRot,false,rot3);
  gl.uniform1f(cloudProg.u.uScale,1.016);
  gl.uniform3fv(cloudProg.u.uSun,SUN);
  gl.uniform3fv(cloudProg.u.uCam,eye);
  gl.uniform1f(cloudProg.u.uT,S.time);
  gl.uniform1f(cloudProg.u.uDrift,cloudDrift);
  gl.uniform1f(cloudProg.u.uFade, smoothstep(1.55,2.50,CAM.dist));
  gl.uniform3fv(cloudProg.u.uRingN, POLE);
  gl.uniform1f(cloudProg.u.uRingFade, ringFade);
  gl.drawElements(gl.TRIANGLES,SPH.idx.length,gl.UNSIGNED_INT,0);

  /* Ring. Same blend and culling the clouds just left set, and the depth the
     planet wrote already hides the far half. */
  if(ringFade > 0.002){
    gl.useProgram(ringProg);
    gl.uniformMatrix4fv(ringProg.u.uVP,false,mVP);
    gl.uniform3fv(ringProg.u.uSun,SUN);
    gl.uniform3fv(ringProg.u.uCam,eye);
    gl.uniform3fv(ringProg.u.uRingN,POLE);
    gl.uniform1f(ringProg.u.uRingFade, ringFade);
    gl.uniform1f(ringProg.u.uPixel, 2.0*Math.tan(FOVY*0.5)/Math.max(1,Hh));
    gl.bindVertexArray(ringVAO);
    gl.drawElements(gl.TRIANGLES,RING.idx.length,gl.UNSIGNED_INT,0);
    gl.bindVertexArray(sphVAO);
  }

  /* atmosphere */
  gl.blendFunc(gl.ONE,gl.ONE); gl.cullFace(gl.FRONT);
  gl.useProgram(atmoProg);
  gl.uniformMatrix4fv(atmoProg.u.uVP,false,mVP);
  gl.uniformMatrix3fv(atmoProg.u.uRot,false,rot3);
  gl.uniform1f(atmoProg.u.uScale,1.34);
  gl.uniform3fv(atmoProg.u.uSun,SUN);
  gl.uniform3fv(atmoProg.u.uCam,eye);
  gl.uniform1f(atmoProg.u.uAtmR,1.34);
  gl.drawElements(gl.TRIANGLES,SPH.idx.length,gl.UNSIGNED_INT,0);
  gl.cullFace(gl.BACK);
  gl.bindVertexArray(null);
}

function m3(a,b){
  const o=new Float32Array(9);
  for(let c=0;c<3;c++)for(let r=0;r<3;r++){
    o[c*3+r]=a[0*3+r]*b[c*3+0]+a[1*3+r]*b[c*3+1]+a[2*3+r]*b[c*3+2];
  }
  return o;
}

/* ---- go ---- */
resize();
CAM.dist = CAM.tDist = fitDist();
requestAnimationFrame(()=>{
  seedWorld();
  plantsSeed();
  updateHUD();
  started=true;
  requestAnimationFrame(frame);
  setTimeout(()=>document.getElementById("splash").classList.add("gone"),120);
  setTimeout(()=>{ const s=document.getElementById("splash"); if(s) s.remove(); },2200);
});

/* small hook used for testing / scripted fast-forward */
window.__world = {
  S, F,
  setSpeed(v){ speed=v; },
  debug(v){ DEBUG=v|0; },
  freeze(v){ spin=v; frozen=true; },
  setView(y,pi,z){ CAM.yaw=y; CAM.pitch=pi; if(z){CAM.zoom=z;} CAM.tDist=fitDist()*CAM.zoom; },
  sunDir(){ return [SUN[0],SUN[1],SUN[2]]; },
  cam(){ return CAM; },
  pointerCount(){ return ptrs.size; },
  params(){ return PARAMS; },
  plants(){
    /* No species to count any more. What matters instead is whether lineages
       are differentiating: which of the five each is committed to, and how
       committed. A collapse to one column, or to no commitment at all, is the
       failure this whole design is trying to avoid. */
    /* the test of the diagnosis: if local kin pressure barely varies between
       nodes, it is measuring how clonal growth is and not how rare a strategy
       is, and it can never create frequency dependence */
    let ks=0, ks2=0, kn=0;
    for(let i=0;i<nodeHigh;i+=97){
      if(NLIVE[i]!==1) continue;
      const c=kinPressure(i); ks+=c; ks2+=c*c; kn++;
    }
    kinMean = kn? ks/kn : 0;
    kinSpread = kn? Math.sqrt(Math.max(0, ks2/kn - kinMean*kinMean)) : 0;
    const per=[0,0,0,0,0]; let spec=0, pace=0;
    for(let i=0;i<nodeHigh;i++){
      if(NLIVE[i]!==1) continue;
      const o=i*G; let mx=0, at=0;
      for(let g=0;g<5;g++) if(GENE[o+g]>mx){ mx=GENE[o+g]; at=g; }
      per[at]++; spec+=(mx-1)/4; pace+=GENE[o+G_PACE];
    }
    return { live:liveN, wood:woodN, slots:nodeHigh, deaths, bodies:comps,
             meanBody:+meanComp.toFixed(1), largestBody:bigFrag,
             frontier:frontN, tick:ptick,
             probe:(()=>{
               let badGene=0, badEnv=0, badFit=0, seen=0, sample=null;
               for(let i=0;i<nodeHigh;i++){
                 if(NLIVE[i]!==1) continue; seen++;
                 const o=i*G; let bg=false;
                 for(let g=0;g<G;g++) if(!isFinite(GENE[o+g])) bg=true;
                 if(bg){ badGene++; continue; }
                 const k=cellAt(NPX[i],NPY[i],NPZ[i]);
                 const m=envAt(k); let be=false;
                 for(let g=0;g<5;g++) if(!isFinite(m[g])) be=true;
                 if(be){ badEnv++; continue; }
                 const f=fitOf(o,k);
                 if(!isFinite(f)) badFit++;
                 else if(!sample) sample={fit:+f.toFixed(3), env:Array.from(m).map(v=>+v.toFixed(2)),
                                          gene:Array.from(GENE.subarray(o,o+5)).map(v=>+v.toFixed(2))};
               }
               return {seen, badGene, badEnv, badFit, sample};
             })(),
             nanFits:dbgNaN, finiteFits:dbgFitOk, hitFloor:dbgFloor,
             meanFit:+(dbgFit/Math.max(1,dbgFitOk)).toFixed(3), meanRawLife:+(dbgRaw/Math.max(1,dbgFitOk)).toFixed(0),
             reapUpdates:dbgHits, meanCrowdSeen:+(dbgCrowd/Math.max(1,dbgHits)).toFixed(3),
             meanLifeSet:+(dbgLife/Math.max(1,dbgHits)).toFixed(0), ageDeaths:dbgAgeDeaths,
             kinMean:+kinMean.toFixed(3), kinSpread:+kinSpread.toFixed(3),
             strategies:Array.from(CENSUS).filter(v=>v>0).length,
             topStrategy:+(Math.max(...CENSUS)/Math.max(1,censusN)).toFixed(3),
             specialisation:+(spec/Math.max(1,liveN)).toFixed(3),
             pace:+(pace/Math.max(1,liveN)).toFixed(3),
             niche:{sea:per[0], ice:per[1], desert:per[2], grass:per[3], forest:per[4]} };
  },
  /* run growth on its own, so the form can be judged without waiting for the
     climate to catch up */
  growPlants(ticks){ for(let i=0;i<(ticks|0);i++) plantsStep(); },
  /* Run the world the way the frame loop does — climate and plants together at
     the same relative rate — because everything measured with growPlants above
     was measured on a planet that never moved, and this project's whole claim
     is that a moving climate is what stops adaptation completing. */
  runWorld(ticks, mult){
    const spd = mult || 1;
    for(let i=0;i<(ticks|0);i++){
      const step = Math.min(0.084*spd, 45);
      S.time += step;
      const rows = Math.ceil(GH/10);
      rebuildBand(bandCursor, Math.min(GH,bandCursor+rows), S.time);
      bandCursor = (bandCursor+rows) % GH;
      if(bandCursor===0) computeProx();
      stepFields(step);
      plantsStep();
    }
    packTexture(); uploadData(); updateHUD();
  },
  advance(seconds, chunks){
    chunks = chunks || Math.max(1, Math.round(seconds/8));
    const step = seconds/chunks;
    for(let i=0;i<chunks;i++){
      S.time += step;
      rebuildBand(0,GH,S.time);
      if(i%3===0) computeProx();
      stepFields(step);
    }
    packTexture(); uploadData(); updateHUD();
  }
};

})();
</script>
</body>
</html>
