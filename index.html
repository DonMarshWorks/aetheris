    r+=ENVCOL[i][0]*w; g+=ENVCOL[i][1]*w; b+=ENVCOL[i][2]*w;
    if(GENE[o+i]>mx) mx=GENE[o+i];
  }
  const spec = Math.max(0, Math.min(1, (mx-1)/3));       // 0 generalist, 1 pure
  const lum = 0.30*r+0.59*g+0.11*b;
  const sat = 0.30+0.70*spec;
  /* Lightness carries the life-history axis, and pace is now per node rather
     than per genome — so a scout and the nursery that made it read differently
     inside one body, which is the difference this design exists to produce. */
  const lift = 0.82+0.36*pace;
  out[0]=(lum+(r-lum)*sat)*lift;
  out[1]=(lum+(g-lum)*sat)*lift;
  out[2]=(lum+(b-lum)*sat)*lift;
}

/* ---- collision: a uniform bin over the cube the sphere sits in. No poles,
   no seam, and a query touches 27 bins whatever the latitude. ---- */
const PCELL = PARAMS.step*PARAMS.collide;
const PGRID = Math.max(8, Math.min(250, Math.floor(2/PCELL)));
const pbins = new Map();
function binOf(x,y,z){
  const i=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const j=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const k=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  return (i*PGRID+j)*PGRID+k;
}
function occupied(x,y,z){
  const i=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const j=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const k=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  const r2 = PCELL*PCELL;
  for(let a=-1;a<=1;a++){
    const ia=i+a; if(ia<0||ia>=PGRID) continue;
    for(let b=-1;b<=1;b++){
      const jb=j+b; if(jb<0||jb>=PGRID) continue;
      for(let c=-1;c<=1;c++){
        const kc=k+c; if(kc<0||kc>=PGRID) continue;
        const list = pbins.get((ia*PGRID+jb)*PGRID+kc);
        if(!list) continue;
        for(let n=0;n<list.length;n++){
          const t=list[n];
          const dx=NPX[t]-x, dy=NPY[t]-y, dz=NPZ[t]-z;
          if(dx*dx+dy*dy+dz*dz < r2) return true;
        }
      }
    }
  }
  return false;
}

function unbin(i){
  const list = pbins.get(NBIN[i]);
  if(!list) return;
  const at = list.indexOf(i);
  if(at >= 0){ list[at] = list[list.length-1]; list.pop(); }
}

/* Risk rising with the density of genetically similar neighbours -- Janzen and
   Connell's rule, and the reason a tropical forest is not one species. It is the
   only pressure here that punishes whatever is *common* rather than punishing
   breadth as such, so it acts against a generalist sweep without penalising
   generalism itself. Measured necessary, not optional: at x1 and at x100 the
   climate maintained no more specialisation than a frozen planet did, so the
   claim that a wandering niche keeps adaptation from completing does not hold
   on its own. It cannot -- the controller relocates environments but keeps each
   of them present, so a specialist's ground moves without shrinking, while
   following it means growing through country only a generalist can cross. */
function kinPressure(i){
  const x=NPX[i], y=NPY[i], z=NPZ[i], o=i*G;
  const R=PARAMS.kinr*PARAMS.step, r2=R*R, d2max=PARAMS.kind*PARAMS.kind;
  const gi=Math.min(PGRID-1,Math.max(0,((x+1)*0.5*PGRID)|0));
  const gj=Math.min(PGRID-1,Math.max(0,((y+1)*0.5*PGRID)|0));
  const gk=Math.min(PGRID-1,Math.max(0,((z+1)*0.5*PGRID)|0));
  const span=Math.max(1,Math.ceil(R/(2/PGRID)));
  let kin=0, all=0;
  for(let a=-span;a<=span;a++){
    const ia=gi+a; if(ia<0||ia>=PGRID) continue;
    for(let b=-span;b<=span;b++){
      const jb=gj+b; if(jb<0||jb>=PGRID) continue;
      for(let c=-span;c<=span;c++){
        const kc=gk+c; if(kc<0||kc>=PGRID) continue;
        const list=pbins.get((ia*PGRID+jb)*PGRID+kc);
        if(!list) continue;
        for(let n=0;n<list.length;n++){
          const t=list[n]; if(t===i) continue;
          const dx=NPX[t]-x, dy=NPY[t]-y, dz=NPZ[t]-z;
          if(dx*dx+dy*dy+dz*dz > r2) continue;
          all++;
          const to=t*G; let d=0;
          for(let g=0;g<5;g++){ const e=GENE[o+g]-GENE[to+g]; d+=e*e; }
          if(d < d2max) kin++;
        }
      }
    }
  }
  return all>0 ? kin/all : 0;
}

/* The strategy a genome is pursuing, coarsely: which of the five it leans on,
   and how hard. Coarse on purpose — scored finely enough, every lineage is
   unique, everyone is rare, and frequency dependence has nothing to bite on. */
const CENSUS = new Int32Array(32);
let censusN = 0;
let dbgHits=0, dbgLife=0, dbgAgeDeaths=0, dbgFit=0, dbgRaw=0, dbgNaN=0, dbgFloor=0, dbgFitOk=0;
/* Where the growth loop's draws actually go. The open question is whether slot
   eligibility and the maturity gate shrink the candidate set enough to be worth
   drawing from uniformly, and that wants measuring rather than assuming. */
let frontDraw=0, frontDrop=0, frontYoung=0, budOk=0, budNo=0;
function strategyOf(o){
  let mx=0, at=0;
  for(let g=0;g<5;g++) if(GENE[o+g]>mx){ mx=GENE[o+g]; at=g; }
  const spec = Math.max(0, Math.min(0.999, (mx-1)/4));
  return at*4 + ((spec*4)|0);
}
/* Rarity has to be measured where rarity exists. A neighbourhood cannot see it:
   growth here is clonal and local, so a node sits among its own siblings whether
   its strategy is unique in the world or universal. Count the whole living
   population instead, and let being common be what costs. */
function census(){
  CENSUS.fill(0); censusN = 0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    CENSUS[strategyOf(i*G)]++; censusN++;
  }
}
function commonness(o){ return censusN>0 ? CENSUS[strategyOf(o)]/censusN : 0; }

function cellAt(x,y,z){
  const lat=Math.asin(Math.max(-1,Math.min(1,y)));
  const lon=Math.atan2(z,x);
  let i=Math.floor((lon+Math.PI)/(Math.PI*2)*GW); i=((i%GW)+GW)%GW;
  let j=Math.floor((Math.PI*0.5-lat)/Math.PI*GH);
  j=Math.max(0,Math.min(GH-1,j));
  return j*GW+i;
}
/* Stage 0 stands in for the affinity formulas: a flat yes/no on where a node
   may sit. Crude, but it is what makes the form read as vegetation rather
   than as a pattern laid over a planet. */
/* ---- what the renderer is handed ----
   Nodes are not painted into a buffer any more. A node that dies has to stop
   being drawn, and there is no way to un-paint a footprint that has already
   been blended with its neighbours — so the sheet is rebuilt from the live set
   each tick instead, on the GPU, where fifty thousand quads cost nothing.
   Everything the look depends on becomes a per-node attribute for free. */
const GHOSTN = 24576, GH_F = 13;     // the fading dead, drawn but not simulated
const GC = new Float32Array(3);
const INST = 9;                                  // floats per node
/* the markers below are extra instances beyond one per node, and this is also
   the ceiling on how many plants `topn` can ring */
const RIMCAP = 8192;
/* Everything that can be drawn in one pass, counted honestly: a node, the
   branch reaching back to its parent, a ring for each of the largest plants,
   and every ghost still fading. Sizing this for only some of them meant that a
   tick with many deaths overran the buffer, bufferSubData was handed more than
   it could hold, and the entire draw failed — so the whole planet's vegetation
   blinked out for exactly one frame. Every loop below is bounded against it. */
const MAXINST = PMAX*2 + RIMCAP + GHOSTN;
const IBUF = new Float32Array(MAXINST*INST);
let instN = 0;


/* Nodes grouped by the plant they belong to, so a body can be drawn in two
   passes. A counting sort over the roots: one pass to count, one to place, and
   node order is preserved inside each body so the result is stable frame to
   frame. */
const ORDER = new Int32Array(PMAX), BOFF = new Int32Array(PMAX+1);
let orderN = 0;
function orderByBody(){
  BOFF.fill(0,0,nodeHigh+1);
  orderN = 0;
  for(let i=0;i<nodeHigh;i++) if(NLIVE[i]!==0){ BOFF[PROOT[i]]++; orderN++; }
  let run=0;
  for(let r=0;r<nodeHigh;r++){ const c=BOFF[r]; BOFF[r]=run; run+=c; }
  for(let i=0;i<nodeHigh;i++) if(NLIVE[i]!==0) ORDER[BOFF[PROOT[i]]++]=i;
}

/* one node of a plant: pass 0 lays its branch, pass 1 its foliage */
function emitNode(i, pass, w){
  if(NLIVE[i]===0) return w;
    const wood = NLIVE[i]===2;
    const x=NPX[i], y=NPY[i], z=NPZ[i];
    const lat=Math.asin(Math.max(-1,Math.min(1,y))), lon=Math.atan2(z,x);
    const cl=Math.max(Math.cos(lat),1e-3);
    const sl=Math.sin(lat), sn=Math.sin(lon), cs=Math.cos(lon);
    const hx=NHX[i], hy=NHY[i], hz=NHZ[i];
    const he=-hx*sn + hz*cs;
    const hn=-hx*sl*cs + hy*cl - hz*sl*sn;

    /* A branch reads as a branch because it tapers. Width comes from age, so
       the old wood near the root is broad and the growing tips are fine —
       which is also the frontier, and also what is about to die. One variable
       tells all three. */
    const age=ptick-NBORN[i];
    const grow=wood ? 1 : Math.min(1, age/Math.max(1,NMAT[i]));
    const go=i*G;
    /* The footprint scales with the step that actually placed this node, so
       the picture stops lying about what is claimed: a long-stepping lineage
       draws further apart because it *is* further apart, and the loose body it
       leaves is ground somebody else can still grow into. */
    const form=NFORM[i];
    const wid=PARAMS.fat*NSTEP[i]*FORMSZ[form&3];
    const asp=FORMASP[(form>>2)&3];

    /* colour: the form's own, drifted by the sector's inherited tint and
       lifted at the young tips, so expansion reads as motion */
    geneColour(go, NPACE[i], GC);
    const young=1-grow;
    let r=GC[0]+young*44, g=GC[1]+young*40, b=GC[2]+young*34;
    /* Dead wood is not black. Black would swamp hue, which is the channel
       carrying niche, and half the standing structure would go to it — the
       planet would read as scorched. Keep the lineage's hue, take the colour
       and the value out of it, and let more ground show through: one value
       ramp from bright new tip to grey wood, so growth and die-back both read
       as movement. */
    if(wood){
      const lum=0.30*r+0.59*g+0.11*b;
      r=(r*0.24+lum*0.76)*0.52; g=(g*0.24+lum*0.76)*0.52; b=(b*0.24+lum*0.76)*0.52;
    }

    const rot=Math.atan2(hn,he);
    /* Solid. Growth and die-back are already carried by colour — a young tip
       is lifted toward white, wood is drained toward grey — so fading them as
       well was saying the same thing twice and costing every leaf its edge.
       The only translucency left in a living plant is the anti-aliasing on the
       footprint rim, and the dying, which should be translucent. */
    const al=PARAMS.alpha*(wood?0.90:1.0);

    /* the branch back to the parent: an ellipse lying along the step, centred
       between the two, so a body reads as connected structure rather than as a
       scatter of blobs. The child's heading is the direction it travelled, so
       it is the direction of the branch too — no extra geometry needed. */
    const par=NPAR[i];
    if(pass===0 && PARAMS.stem>0 && par>=0 && NLIVE[par]!==0 && NGEN[par]===NPGEN[i]){
      let mx=(x+NPX[par])*0.5, my=(y+NPY[par])*0.5, mz=(z+NPZ[par])*0.5;
      const ml=1/Math.hypot(mx,my,mz); mx*=ml; my*=ml; mz*=ml;
      const mlat=Math.asin(Math.max(-1,Math.min(1,my))), mlon=Math.atan2(mz,mx);
      IBUF[w  ]=(mlon+Math.PI)/(Math.PI*2);
      IBUF[w+1]=(Math.PI*0.5-mlat)/Math.PI;
      IBUF[w+2]=NSTEP[i]*0.56;
      IBUF[w+3]=PARAMS.stem*NSTEP[i];
      IBUF[w+4]=rot;
      IBUF[w+5]=Math.min(255,r*PARAMS.stemdark)/255;
      IBUF[w+6]=Math.min(255,g*PARAMS.stemdark)/255;
      IBUF[w+7]=Math.min(255,b*PARAMS.stemdark)/255;
      IBUF[w+8]=al;
      w+=INST;
    }

    if(pass===0) return w;
    IBUF[w  ]=(lon+Math.PI)/(Math.PI*2);
    IBUF[w+1]=(Math.PI*0.5-lat)/Math.PI;
    IBUF[w+2]=wid*asp;
    IBUF[w+3]=wid;
    IBUF[w+4]=rot;
    IBUF[w+5]=Math.min(255,r)/255;
    IBUF[w+6]=Math.min(255,g)/255;
    IBUF[w+7]=Math.min(255,b)/255;
    IBUF[w+8]=al;
    w+=INST;
  
  return w;
}

function buildInstances(){
  let w=0;
  const WLIM=(MAXINST-2)*INST;
  /* One ring per plant, at its centroid, rather than an outline. Two things
     were tried and abandoned: marking every node of a plant floods it, because
     the nodes are translucent and do not tile solidly so the colour bleeds
     through every gap; and marking the nodes that still have a free slot is not
     the perimeter either, because on a crowded planet most nodes are blocked
     rather than full. A real outline needs a neighbour count per node, and that
     is a lot of machinery for an annotation. A ring cannot speckle, it scales
     with the plant so the big ones are obviously big, and it can be counted.

     Magenta because every colour this world makes is a blend of the five
     environment colours, and the one hue the palette cannot produce is the one
     that reads as an annotation instead of as biology. The negative alpha is
     the flag that tells the fragment shader to draw a ring, not a disc. */
  const rimAmt=PARAMS.rim;
  if(PARAMS.topn>0 && rimAmt>0){
    const stepR=PARAMS.step;
    for(let r=0;r<nodeHigh && w<WLIM;r++){
      if(!BTOP[r] || PSIZE[r]<=0) continue;
      const n=PSIZE[r];
      let x=BX[r]/n, y=BY[r]/n, z=BZ[r]/n;
      const l=Math.hypot(x,y,z);
      if(!(l>1e-6)) continue;
      x/=l; y/=l; z/=l;
      const lat=Math.asin(Math.max(-1,Math.min(1,y))), lon=Math.atan2(z,x);
      /* the radius a mat of n nodes would have if it were a disc, so the ring
         sits about where the plant ends */
      const rad=Math.max(5*stepR, Math.min(0.20, Math.sqrt(n/Math.PI)*1.35*stepR));
      IBUF[w  ]=(lon+Math.PI)/(Math.PI*2);
      IBUF[w+1]=(Math.PI*0.5-lat)/Math.PI;
      IBUF[w+2]=rad; IBUF[w+3]=rad; IBUF[w+4]=0;
      IBUF[w+5]=1.0; IBUF[w+6]=0.14; IBUF[w+7]=0.80;
      IBUF[w+8]=-rimAmt;
      w+=INST;
    }
  }
  /* the dying, drawn first so the living paint over them */
  for(let n=0;n<GHOSTN && w<WLIM;n++){
    const g=n*GH_F, t=(ptick-GHOST[g+6])/FADE;
    if(!(t>=0 && t<1) || GHOST[g+2]<=0) continue;
    /* the colour drains as well as the cover: down in value and most of the
       way to grey, so it reads as life leaving rather than as a dissolve */
    const k=(1.0-t)*(1.0-0.55*t);
    const lum=0.30*GHOST[g+3]+0.59*GHOST[g+4]+0.11*GHOST[g+5];
    const gr=Math.min(255,(GHOST[g+3]+(lum-GHOST[g+3])*t*0.7)*k)/255;
    const gg=Math.min(255,(GHOST[g+4]+(lum-GHOST[g+4])*t*0.7)*k)/255;
    const gb=Math.min(255,(GHOST[g+5]+(lum-GHOST[g+5])*t*0.7)*k)/255;
    const ga=PARAMS.alpha*0.62*(1.0-t)*(1.0-t);
    const gw=GHOST[g+2]*(1.0-0.25*t);
    /* the branch goes at the same moment and at the same rate: fading the node
       while its branch had already vanished dissolved a plant in two stages */
    if(GHOST[g+11]>0 && w<WLIM-INST){
      const d=PARAMS.stemdark;
      IBUF[w  ]=GHOST[g+9]; IBUF[w+1]=GHOST[g+10];
      IBUF[w+2]=GHOST[g+11]*0.56; IBUF[w+3]=PARAMS.stem*GHOST[g+11];
      IBUF[w+4]=GHOST[g+8];
      IBUF[w+5]=gr*d; IBUF[w+6]=gg*d; IBUF[w+7]=gb*d;
      IBUF[w+8]=ga;
      w+=INST;
    }
    IBUF[w  ]=GHOST[g]; IBUF[w+1]=GHOST[g+1];
    IBUF[w+2]=gw*GHOST[g+7]; IBUF[w+3]=gw;
    IBUF[w+4]=GHOST[g+8];
    IBUF[w+5]=gr; IBUF[w+6]=gg; IBUF[w+7]=gb;
    IBUF[w+8]=ga;
    w+=INST;
  }
  /* Leaves sit on top of the branches that carry them, so every branch of a
     plant goes down before any of its nodes — but per plant, not globally: one
     plant may legitimately stand over another, and flattening all the branches
     of the world under all its foliage would lose that. The order plants are
     drawn in must also never change between frames, or overlapping neighbours
     swap depth and the picture flickers, so they are walked by body in node
     order and both are stable. */
  orderByBody();
  const limbs = PARAMS.limbs|0;
  for(let a=0;a<orderN && w<WLIM;){
    const root = PROOT[ORDER[a]];
    let b=a;
    while(b<orderN && PROOT[ORDER[b]]===root) b++;
    if(limbs===0){
      for(let q=a;q<b && w<WLIM;q++){
        const i=ORDER[q];
        w = emitNode(i, 0, w); w = emitNode(i, 1, w);
      }
    } else {
      const first = limbs===2 ? 1 : 0;
      for(let q=a;q<b && w<WLIM;q++) w = emitNode(ORDER[q], first, w);
      for(let q=a;q<b && w<WLIM;q++) w = emitNode(ORDER[q], 1-first, w);
    }
    a=b;
  }
  instN=w/INST;
}

/* The three outputs read once at birth and kept for life, so that a body is a
   permanent record of the conditions each of its nodes grew through. */
function readBirthOutputs(i){
  runProgram(i);
  const cap = 1 + (((KIDMAX-0.001)*squash(OUTV[O_CAP]))|0);
  const pace = squash(OUTV[O_PACE]);
  /* The inherited vector says what this lineage is for; the formula says how
     this particular node leans, given where it found itself. One body can then
     hold sea nodes and forest nodes at once — which is what a plant that can
     sense terrain ought to be able to do — without any node being able to
     simply become whatever it is standing on. */
  const o=i*G;
  for(let n=0;n<5;n++){
    const m = AFLO*Math.pow(AFHI/AFLO, squash(OUTV[O_AFF+n]));
    GENE[o+n] = Math.max(0.02, Math.min(5, GENE[o+n]*m));
    recordOut(O_AFF+n, m);
  }
  normalise(o);
  { const e=i*5; let f=0;
    for(let n=0;n<5;n++) f+=GENE[o+n]*NENV[e+n];
    NFIT[i]=f; }
  NCAP[i]=cap; NPACE[i]=pace;
  /* Two plants of similar colour standing side by side were impossible to tell
     apart. Size and aspect are quantised into a few classes off the genome
     itself, so they are inherited exactly as colour is: a sector keeps its form,
     related plants look related, and a neighbour that is genuinely a different
     lineage looks different. Not decoration — the same projection principle,
     on two more channels. */
  let h=(NCAP[i]*2654435761)>>>0;
  for(let n=0;n<NOUT;n++) h=(h*16777619 ^ POUT[i*NOUT+n])>>>0;
  for(let n=0;n<NK;n++)   h=(h*16777619 ^ ((KONST[i*NK+n]*7)|0))>>>0;
  NFORM[i]=h%12;
  /* Pace buys growth with life, and this time it buys something: a node cannot
     bud at all until it has matured, so a high-pace node is productive almost
     at once and short-lived, and a low-pace node spends a long time as
     structure before it contributes anything, and persists. That is the scout
     and the nursery, and it is the only thing that gives a plant any notion of
     investment. The old scalar pace had the cost and never the benefit, which
     is why selection could only ever delete it. */
  NMAT[i]  = Math.max(1, Math.min(MATB-1, (matBase*(1.60-1.20*pace))|0));
  NLIFE[i] = Math.max(PARAMS.hostile|0, (PARAMS.life*capFit(NFIT[i])*(1.40-0.80*pace))|0);
  recordBirth(cap, pace, Math.tanh(OUTV[O_VIG]*0.25));
}

/* ---- dying ----
   A node that is released vanished between one frame and the next, and a
   planet where things blink out reads as bookkeeping rather than as death.
   Ghosts are a drawing-only ring: position, colour and the tick it went, faded
   out over FADE ticks and then overwritten. They hold no ground — they are not
   in the collision bins and nothing can see them — so nothing in the simulation
   knows they exist, which is what keeps this free. */
const GHOST = new Float32Array(GHOSTN*GH_F);
let ghostAt = 0;
function ghost(i){
  const g=(ghostAt%GHOSTN)*GH_F; ghostAt++;
  const x=NPX[i], y=NPY[i], z=NPZ[i];
  const lat=Math.asin(Math.max(-1,Math.min(1,y))), lon=Math.atan2(z,x);
  const cl=Math.max(Math.cos(lat),1e-3), sl=Math.sin(lat);
  const sn=Math.sin(lon), cs=Math.cos(lon);
  const he=-NHX[i]*sn + NHZ[i]*cs;
  const hn=-NHX[i]*sl*cs + NHY[i]*cl - NHZ[i]*sl*sn;
  geneColour(i*G, NPACE[i], GC);
  const form=NFORM[i];
  GHOST[g  ]=(lon+Math.PI)/(Math.PI*2);
  GHOST[g+1]=(Math.PI*0.5-lat)/Math.PI;
  GHOST[g+2]=PARAMS.fat*NSTEP[i]*FORMSZ[form&3];
  GHOST[g+3]=GC[0]; GHOST[g+4]=GC[1]; GHOST[g+5]=GC[2];
  GHOST[g+6]=ptick;
  GHOST[g+7]=FORMASP[(form>>2)&3];
  GHOST[g+8]=Math.atan2(hn,he);
  /* the branch goes with it: fading the node while its branch had already
     vanished left a plant dissolving in two stages */
  const par=NPAR[i];
  if(par>=0 && NLIVE[par]!==0 && NGEN[par]===NPGEN[i]){
    let mx=(x+NPX[par])*0.5, my=(y+NPY[par])*0.5, mz=(z+NPZ[par])*0.5;
    const ml=1/Math.hypot(mx,my,mz); mx*=ml; my*=ml; mz*=ml;
    GHOST[g+9]=(Math.atan2(mz,mx)+Math.PI)/(Math.PI*2);
    GHOST[g+10]=(Math.PI*0.5-Math.asin(Math.max(-1,Math.min(1,my))))/Math.PI;
    GHOST[g+11]=NSTEP[i];
  } else GHOST[g+11]=0;
  GHOST[g+12]=0;
}

function addNode(x,y,z,hx,hy,hz,src,par,amt,stepUsed){
  const i = freeN>0 ? PFREE[--freeN] : nodeHigh++;
  NPX[i]=x; NPY[i]=y; NPZ[i]=z;
  NHX[i]=hx; NHY[i]=hy; NHZ[i]=hz;
  NKID[i]=0; NSLOT[i]=0; NLIVE[i]=1; NSTEP[i]=stepUsed; NCAP[i]=1;
  if(src<0) randomGenome(i);
  else if(amt>0){
    inheritMutated(src,i,amt);
    /* the bins hold living nodes and this one is not in them yet, so there is
       no need to exclude it */
    if(PARAMS.hgt>0 && prnd()<PARAMS.hgt) borrowFrom(i,x,y,z,PROOT[src]);
  }
  else {
    inherit(src,i);
    /* Variation is otherwise minted only where a branch forks, so a lineage
       that never branches copies itself down a vine for ever and cannot
       evolve at all. A small chance on every node is the floor under that. */
    if(prnd() < PARAMS.nodemut){
      const n=PARAMS.pmut*mutScale();
      let k=n|0; if(prnd() < n-k) k++;
      for(let t=0;t<k;t++) pointMutate(i);
    }
  }
  NGEN[i]++; NPAR[i]=par; NPGEN[i] = par>=0 ? NGEN[par] : -1;
  NLK[i]=0; if(par>=0) NLK[par]++;
  PROOT[i] = par>=0 ? PROOT[par] : i;   /* body identity, kept fresh between sweeps */
  /* Depth is depth below the body's *own* root, not generations since the
     world began, because that is the quantity architecture can be built on.
     pruneFragments recomputes it whenever a body splits; between sweeps a new
     node simply counts on from its parent. */
  NDEP[i] = par>=0 ? Math.min(65535, NDEP[par]+1) : 0;
  NPCAP[i] = par>=0 ? NCAP[par] : 0;
  NBORN[i]=ptick;
  if(par<0) BVIG[i]=0;
  const key = binOf(x,y,z);
  NBIN[i]=key;
  const list = pbins.get(key);
  if(list) list.push(i); else pbins.set(key,[i]);
  const cc = coarseOf(x,y,z); NCC[i]=cc; CCOUNT[cc]++;
  refreshEnv(i);

  readBirthOutputs(i);
  liveN++; plantsDirty=true;
  joinWhenMature(i);
  return i;
}

/* A node that dies still holding children does not vanish: it stops growing,
   stops counting as alive, and stays in the tree as structure — heartwood,
   which is dead in a real trunk too and still holds the tree up. It is let go
   only when its last child goes, and then its own dead parent may follow.
   Without this, ageing alone split a fifth of all deaths into separate bodies
   and nothing could grow larger than about ten nodes; splitting is now
   something only the world can do, by killing a whole region. */
function freeNode(i){
  for(let j=i;;){
    const par = rooted(j) ? NPAR[j] : -1;
    if(NLIVE[j]===2) woodN--;
    else if(NLIVE[j]===1){ CCOUNT[NCC[j]]--; freeGround(NPX[j],NPY[j],NPZ[j]); }
    ghost(j);
    NLIVE[j]=0; NONF[j]=0; unbin(j); PFREE[freeN++]=j;
    if(par<0) break;
    if(--NLK[par] > 0) break;
    if(NLIVE[par]!==2) break;      /* a living parent simply loses a child */
    j = par;                       /* wood with nothing left to hold: let go */
  }
  plantsDirty=true;
}

function killNode(i){
  if(NLIVE[i]!==1) return;
  liveN--; deaths++; plantsDirty=true;
  if(NLK[i]>0){
    /* Wood holds the body together but stops holding *ground*. Left in the
       collision bins it walled off two fifths of the planet against the very
       plants that made it, and a body could never grow back through its own
       dead interior — which is exactly what a crust does. */
    CCOUNT[NCC[i]]--;              /* wood is structure, not a living neighbour */
    NLIVE[i]=2; NONF[i]=0; woodN++; unbin(i);
    freeGround(NPX[i],NPY[i],NPZ[i]);   /* and it stops holding ground, too */
    /* Wood is only ever released from the tips inward, while growth runs the
       other way, so it accumulates without limit and eventually crowds the
       living out. Real crust sheds. Give it its own clock: when it rots
       through, whatever it was holding becomes a body in its own right — so
       decay, not ageing, is what fragments a plant, at a rate we choose. */
    NLIFE[i] = (ptick - NBORN[i]) + (PARAMS.rot|0);
  }
  else freeNode(i);
}

/* All nodes die, and because lifespan follows fit the oldest wood is nearest
   the root — so a body hollows out from the middle and breaks into a ring of
   pieces that go on independently. Checked a slice at a time on a rolling
   cursor, the way the terrain is rebuilt, rather than scanning every node
   every tick. */
function reap(){
  const slice = Math.max(256, (nodeHigh/9)|0);
  for(let n=0;n<slice;n++){
    const i = reapCursor++; if(reapCursor>=nodeHigh) reapCursor=0;
    if(NLIVE[i]===0) continue;
    if(NLIVE[i]===2){
      if(ptick-NBORN[i] > NLIFE[i]) freeNode(i);   /* rotted through */
      continue;
    }
    if(ptick-NBORN[i] > NLIFE[i]){ dbgAgeDeaths++; killNode(i); continue; }
    /* The climate moves under them, so the ground is re-read and the allowance
       revised. Hostile ground shortens a life, it does not end one: a node that
       the sea has just closed over goes on for a while and then expires early,
       which is both what was intended and far less violent than killing on
       sight. Killing outright severed a body at every interior node the moment
       a niche shifted, and the shower of fragments that followed read as the
       design failing when it was only this. */
    if((n&7)===0){
      const o=i*G, f=refreshEnv(i);
      const crowd = PARAMS.kin>0 ? kinPressure(i) : 0;
      const freq  = PARAMS.rare>0 ? commonness(o) : 0;
      const raw = PARAMS.life*capFit(f)*(1.40-0.80*NPACE[i])*(1-PARAMS.kin*crowd)*(1-PARAMS.rare*freq);
      const nl = Math.max(PARAMS.hostile|0, raw|0);
      dbgHits++; dbgLife+=nl;
      if(!isFinite(f)) dbgNaN++; else { dbgFit+=f; dbgFitOk++; dbgRaw+=raw; if(raw < (PARAMS.hostile|0)) dbgFloor++; }
      NLIFE[i]=nl;
    }
  }
}

function bud(ni){
  const go = ni*G;
  const px=NPX[ni], py=NPY[ni], pz=NPZ[ni];
  const hx=NHX[ni], hy=NHY[ni], hz=NHZ[ni];

  const cap=NCAP[ni];
  if(NKID[ni] >= cap) return false;
  /* Read once here, for this child. Both the step and the drift are per child
     rather than per node, which is what lets one node put its children at
     different distances, and lets the distance change along a branch as it
     ages — a tight spiral that lengthens as it grows outward, rather than a
     lineage that is uniformly compact or uniformly stringy. */
  runProgram(ni);
  const spr = PARAMS.splo + (PARAMS.sphi-PARAMS.splo)*squash(OUTV[O_SPREAD]);
  const ang = PARAMS.angmax*Math.tanh(OUTV[O_ANGLE]*0.25);
  recordChild(spr, ang);
  let th, slot=-1;
  if(PARAMS.slots>0){
    /* One of the slots still open, chosen at random from those remaining. A
       slot blocked by a neighbour is simply not taken this time and stays
       open. */
    const mask=NSLOT[ni], sc=cap>5?5:cap;
    let nfree=0;
    for(let s=0;s<sc;s++) if(!(mask&(1<<s))) FREESLOT[nfree++]=s;
    if(nfree===0) return false;
    slot = FREESLOT[(prnd()*nfree)|0];
    th = SLOTS[sc][slot] + (prnd()*2-1)*PARAMS.jitter;
  } else {
    /* Whatever the genome says, with nothing added and nothing enforced. */
    th = ang;
    if(NKID[ni]>0){ angDiffSum += Math.abs(th-NLASTANG[ni]); angDiffN++; }
    NLASTANG[ni] = th;
  }

  /* turn the heading about the surface normal */
  const cx=py*hz-pz*hy, cy=pz*hx-px*hz, cz=px*hy-py*hx;
  const c=Math.cos(th), s=Math.sin(th);
  const ax=hx*c+cx*s, ay=hy*c+cy*s, az=hz*c+cz*s;

  /* step along the geodesic, and carry the heading with it. The distance is
     the parent's spread: long steps cover ground quickly but leave a loose
     body others can grow into, short steps build a dense mat that resists
     invasion and claims territory slowly. */
  const d=PARAMS.step*spr, cd=Math.cos(d), sd=Math.sin(d);
  let nx=px*cd+ax*sd, ny=py*cd+ay*sd, nz=pz*cd+az*sd;
  let l=1/Math.hypot(nx,ny,nz); nx*=l; ny*=l; nz*=l;
  let ex=-px*sd+ax*cd, ey=-py*sd+ay*cd, ez=-pz*sd+az*cd;
  const dp=ex*nx+ey*ny+ez*nz; ex-=nx*dp; ey-=ny*dp; ez-=nz*dp;
  l=1/Math.hypot(ex,ey,ez); ex*=l; ey*=l; ez*=l;

  if(fitAt(nx,ny,nz,go) < PARAMS.viable) return false;
  if(occupied(nx,ny,nz)){ angBlocked++; return false; }
  /* The first child continues the sector on its parent's genome exactly; the
     second and later are true bifurcations and mint a mutated one. Mutating
     every node instead would let drift inside one body swamp the differences
     between bodies — lineages would blur and selection could not accumulate.
     This way a sector is a coherent unit for selection to act on, and a piece
     that breaks off carries a real identity rather than a smear. */
  const kid = addNode(nx,ny,nz,ex,ey,ez,ni,ni, NKID[ni] > 0 ? PARAMS.mut : 0, d);
  NANG[kid]=th;
  if(slot>=0) NSLOT[ni] |= (1<<slot);
  NKID[ni]++;
  return true;
}

/* thrown clear of the parent, landing anywhere that suits, and rooted in its
   own right — a new body, carrying its parent's colour */
function spore(ni){
  const go = ni*G;
  /* A founder cannot out-compete an established neighbour on equal terms; its
     only opening is to arrive different enough to hold ground nobody else
     wants. So the ground it will accept can be loosened separately from the
     ground ordinary growth accepts, and what it carries can be mutated harder
     than an ordinary bifurcation — dispersal as experiment rather than as a
     copy of the incumbent posted elsewhere. */
  const need = PARAMS.sporeviable >= 0 ? PARAMS.sporeviable : PARAMS.viable;
  for(let a=0;a<24;a++){
    const u=prnd()*2-1, ph=prnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    const x=r*Math.cos(ph), y=u, z=r*Math.sin(ph);
    if(fitAt(x,y,z,go) < need) continue;
    if(occupied(x,y,z)) continue;
    let ax=-Math.sin(ph), ay=0, az=Math.cos(ph);
    const bx=y*az-z*ay, by=z*ax-x*az, bz=x*ay-y*ax;
    const th=prnd()*Math.PI*2, cc=Math.cos(th), ss=Math.sin(th);
    let hx=ax*cc+bx*ss, hy=ay*cc+by*ss, hz=az*cc+bz*ss;
    const dp=hx*x+hy*y+hz*z; hx-=x*dp; hy-=y*dp; hz-=z*dp;
    const l=1/Math.hypot(hx,hy,hz);
    addNode(x,y,z,hx*l,hy*l,hz*l,ni,-1,PARAMS.mut*PARAMS.sporemut,PARAMS.step);
    return true;
  }
  return false;
}

/* A severed piece too small to be a body is debris: it costs bookkeeping,
   clutters any measure of diversity, and reads as noise rather than as life.
   Identity is the connected component, found by walking parent links — and a
   link is only believed when the generation matches, because a slot freed by
   one death is handed straight to the next birth and would otherwise graft a
   fragment onto a stranger. */
const PROOT=new Int32Array(PMAX), PSIZE=new Int32Array(PMAX), PSTK=new Int32Array(PMAX);
const BTOP=new Uint8Array(PMAX); const SIZES=[];   // the largest plants, ringed
const BX=new Float32Array(PMAX), BY=new Float32Array(PMAX), BZ=new Float32Array(PMAX);

/* ---- history, so stasis can be seen rather than guessed at ----
   The question a run has to answer is whether anything is still improving, and
   two endpoints cannot tell a slow climb from an oscillation from a dead stop.
   Samples are taken on the component sweep, which already walks every plant, so
   this costs one extra pass over the roots. When the buffer fills, every other
   sample is dropped and the interval doubles — so the whole run stays on screen
   at whatever resolution the run's own length allows, for ever, in fixed
   memory. */
const HCAP = 1024;
const HSER = [
  {k:"live",  label:"living nodes",        v:new Float32Array(HCAP)},
  {k:"bodies",label:"plants",              v:new Float32Array(HCAP)},
  {k:"meanB", label:"mean plant size",     v:new Float32Array(HCAP)},
  {k:"maxB",  label:"largest plant",       v:new Float32Array(HCAP)},
  {k:"fit",   label:"mean fit",            v:new Float32Array(HCAP)},
  /* `want` is the side of a line the piece needs to stay on. Only these two
     carry it, because only these two *are* the acceptance test: diversity must
     not collapse. Everything else is description; these are the pass mark. */
  {k:"even",  label:"niche evenness",      v:new Float32Array(HCAP), lo:0, hi:1, want:0.45, above:true},
  {k:"top",   label:"biggest lineage share",v:new Float32Array(HCAP), lo:0, hi:1, want:0.50, above:false},
  {k:"mixed", label:"plants of two minds", v:new Float32Array(HCAP), lo:0, hi:1},
  {k:"pace",  label:"mean pace",           v:new Float32Array(HCAP), lo:0, hi:1},
  {k:"spec",  label:"specialisation",      v:new Float32Array(HCAP), lo:0, hi:1},
];
const HT = new Float32Array(HCAP);            // tick each sample was taken at
let hN = 0, hEvery = 1, hSkip = 0;
const HWHERE = new Float64Array(5);           // where life actually is
function historySample(vals){
  if(++hSkip < hEvery) return;
  hSkip = 0;
  if(hN >= HCAP){                             // halve the resolution, keep the span
    for(let n=0;n<HCAP>>1;n++){
      HT[n]=HT[n*2];
      for(const s of HSER) s.v[n]=s.v[n*2];
    }
    hN = HCAP>>1; hEvery *= 2;
  }
  HT[hN]=ptick;
  for(const s of HSER) s.v[hN]=vals[s.k];
  hN++;
}
function rooted(i){
  const p=NPAR[i];
  return p>=0 && NLIVE[p]!==0 && NGEN[p]===NPGEN[i];
}
function pruneFragments(){
  const minf = PARAMS.minfrag|0;
  if(nodeHigh===0) return;
  PROOT.fill(-1,0,nodeHigh);
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===0 || PROOT[i]>=0) continue;
    let sn=0, j=i;
    for(;;){
      PSTK[sn++]=j;
      if(!rooted(j)) break;
      const p=NPAR[j];
      if(PROOT[p]>=0) break;
      j=p;
    }
    const last=PSTK[sn-1];
    const known = rooted(last) && PROOT[NPAR[last]]>=0;
    const r = known ? PROOT[NPAR[last]] : last;
    /* The chain unwinds root-first, so depth below the body's own root falls
       straight out of the same walk. It has to be recomputed here rather than
       only counted from the parent at birth: when a body splits, every node in
       the severed half is suddenly nearer its root than it was, and depth is
       the input a lineage builds architecture on. */
    let d = known ? NDEP[NPAR[last]]+1 : 0;
    while(sn>0){ const q=PSTK[--sn]; PROOT[q]=r; NDEP[q]=d<65535?d:65535; d++; }
  }
  /* size is counted in living nodes: a body held up by wood alone is a corpse */
  PSIZE.fill(0,0,nodeHigh);
  for(let i=0;i<nodeHigh;i++) if(NLIVE[i]===1) PSIZE[PROOT[i]]++;
  /* A body's root is nearly always wood now, so counting living nodes that
     are their own root counts nothing at all. Count the distinct roots that
     still have anything living under them. */
  comps=0; bigFrag=0; let tot=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===0 || PROOT[i]!==i || PSIZE[i]===0) continue;
    comps++; tot+=PSIZE[i]; if(PSIZE[i]>bigFrag) bigFrag=PSIZE[i];
  }
  meanComp = comps? tot/comps : 0;
  /* Which plants are the big ones, so the renderer can ring them. Colour is
     already carrying three things — hue says which environment a lineage is
     built for, saturation how committed it is, lightness the life-history —
     and overriding any of those to mark size would destroy the channel that
     makes convergent evolution visible. A rim adds a channel instead of
     stealing one. */
  BTOP.fill(0,0,nodeHigh);
  const topn = PARAMS.topn|0;
  if(topn>0){
    SIZES.length = 0;
    for(let i=0;i<nodeHigh;i++)
      if(NLIVE[i]!==0 && PROOT[i]===i && PSIZE[i]>0) SIZES.push(PSIZE[i]);
    if(SIZES.length){
      SIZES.sort((a,b)=>b-a);
      const cut = SIZES[Math.min(SIZES.length,topn)-1];
      /* ties at the threshold would let the count run away on a planet of
         equal-sized plants, so admit them only until the quota is full */
      let left = topn;
      for(let i=0;i<nodeHigh && left>0;i++)
        if(NLIVE[i]!==0 && PROOT[i]===i && PSIZE[i]>=cut){ BTOP[i]=1; left--; }
    }
  }
  /* Where life *is*, which is not the same question as what it is built for —
     a lineage whose strongest affinity is forest may be living in the sea, and
     counting genomes by their strongest affinity cannot tell you that. Summed
     over the memberships each node actually stands in. */
  HWHERE.fill(0); BCM.fill(0,0,nodeHigh);
  BX.fill(0,0,nodeHigh); BY.fill(0,0,nodeHigh); BZ.fill(0,0,nodeHigh);
  let hn=0, hpace=0, hspec=0, hfit=0, hmixed=0, hbodies=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    const e=i*5, o=i*G, r=PROOT[i];
    for(let g=0;g<5;g++) HWHERE[g]+=NENV[e+g];
    let mx=0; for(let g=0;g<5;g++) if(GENE[o+g]>mx) mx=GENE[o+g];
    hspec+=(mx-1)/4; hpace+=NPACE[i]; hfit+=NFIT[i]; hn++;
    BCM[r] |= (1<<NCAP[i]);
    /* summed in 3D and normalised after, so a plant straddling the date line
       has a centroid on the plant rather than on the far side of the world */
    BX[r]+=NPX[i]; BY[r]+=NPY[i]; BZ[r]+=NPZ[i];
  }
  for(let r=0;r<nodeHigh;r++){
    if(PSIZE[r]<8 || PROOT[r]!==r) continue;
    hbodies++;
    let m=BCM[r], bits=0; while(m){ bits+=m&1; m>>=1; }
    if(bits>=2) hmixed++;
  }
  let wtot=0; for(let g=0;g<5;g++) wtot+=HWHERE[g];
  let ent=0;
  if(wtot>0) for(let g=0;g<5;g++){ const p=HWHERE[g]/wtot; if(p>0) ent-=p*Math.log(p); }
  historySample({
    live:liveN, bodies:comps, meanB:meanComp, maxB:bigFrag,
    fit:hn>0 ? hfit/hn : 0,
    even:ent/Math.log(5),
    top:censusN>0 ? Math.max.apply(null,CENSUS)/censusN : 0,
    mixed:hbodies>0 ? hmixed/hbodies : 0,
    pace:hn>0 ? hpace/hn : 0, spec:hn>0 ? hspec/hn : 0,
  });

  /* A body that has just been founded is one node, which is below any sane
     minimum. Spare it until it has had time to establish, or the cull becomes
     a ratchet that removes bodies and never lets one begin. */
  const settle = Math.max(1, PARAMS.settle|0), yf = PARAMS.younger;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]===1){
      const r=PROOT[i];
      /* the threshold a body must clear rises as it ages: lenient while it is
         establishing, full strength once it has had its chance. A single
         switch at a fixed age is what made raising `minfrag` an extinction
         cliff — every founder was measured against the full bar the instant
         its grace ran out. */
      /* A body is founded with exactly one node, so the bar has to start at
         nothing and rise — starting it at a *fraction* of the full threshold
         culls every founder on the tick it appears, and the planet is sterile
         within a few hundred ticks. Spared outright for the first `younger` of
         its grace, then the bar climbs to full by the end of it. */
      let a=((ptick-NBORN[r])/settle - yf)/Math.max(1e-3,1-yf);
      a = a<0?0:(a>1?1:a);
      const need=minf*a*a*(3-2*a);
      if(PSIZE[r] < need) killNode(i);
    }
    else if(NLIVE[i]===2 && PSIZE[PROOT[i]]===0) freeNode(i);
  }
}

/* Candidates come from the frontier, never from the body. Sampling the body
   would make a large plant spend its turns on interior nodes that cannot grow,
   and the size distribution would then be set by that accident rather than by
   anything chosen. */
function plantsStep(){
  if(!plantsOn) return;
  ptick++;
  admitMature();
  reap();
  /* census first: pruneFragments samples the history and reads it */
  if(PARAMS.sweep>0 && ptick%(PARAMS.sweep|0)===0){ census(); pruneFragments(); }

  /* Attempts used to be drawn from one global frontier, which made a form's
     growth proportional to how much of the world it already held — so the
     seeding lottery decided the final shares and the sea stayed empty beside
     perfectly good shelf. One attempt per body per turn instead: a small
     population then expands at the same rate per body as a large one and can
     actually converge on its niche. Capped, so cost stays bounded. */
  const cap = PARAMS.grow|0, perBody = PARAMS.perbody > 0;
  const vote = Math.max(1, PARAMS.vote|0), vmem = PARAMS.vmem, tries = PARAMS.tries|0;
  let tried=0, guard=cap*8;
  while(tried < cap && guard-- > 0 && frontN > 0 && (liveN+woodN) < PMAX){
    /* Vigour ranks nodes *within* a body and never bodies against each other.
       A tournament between whichever tips happen to be drawn would do the
       opposite, and the runaway is obvious: the lineage that shouts loudest
       wins every draw, vigour pins at its ceiling, and the output becomes a
       constant — losing exactly the conditional behaviour it exists for. So a
       candidate is scored against its own body's running level instead, which
       a uniform shift cannot move, exactly as a within-plant maximum cannot be
       moved by a plant-wide multiplier. Between bodies the score is then noise,
       and allocation stays where the frontier put it: proportional to tips. */
    let best=-1, bestFi=-1, bestTag=0, bestScore=-Infinity;
    for(let v=0;v<vote;v++){
      /* the draws below retire stale entries, and enough of them in one round
         empties the frontier — drawing from it then indexes nothing and
         retiring takes the count negative */
      if(frontN<=0) break;
      const fi = (prnd()*frontN)|0;
      const fv = PFRONT[fi], ni = fv%PMAX;
      /* eligibility, and the only place the frontier is cleaned: a node is
         eligible while it has an unused slot and is old enough to use it */
      if(NLIVE[ni]!==1 || !same(fv,ni) || NKID[ni]>=NCAP[ni]){ retire(fi); frontDrop++; continue; }
      frontDraw++;
      if(ptick-NBORN[ni] < NMAT[ni]){ frontYoung++; continue; }
      runProgram(ni);
      const vg = Math.tanh(OUTV[O_VIG]*0.25);
      const b = PROOT[ni], s = vg - BVIG[b];
      BVIG[b] += s*vmem;
      if(s > bestScore){ bestScore=s; best=ni; bestFi=fi; bestTag=fv; }
    }
    if(best<0) continue;
    /* Sampling the frontier is already the fair rule the brief was reaching
       for: the frontier is the perimeter, so a body's growth follows its
       number of tips rather than its area, and per unit area it still slows
       as 1/r. Strict one-bud-per-body only made sense while fragmentation was
       minting plants by the thousand; with nothing splitting, forty plants
       taking one node a turn cannot fill a planet. */
    if(perBody){
      const body = PROOT[best];
      if(CSTAMP[body] === ptick) continue;
      CSTAMP[body] = ptick;
    }
    tried++;
    /* Fragmentation used to found new bodies as a side effect of falling
       apart. Now that nothing falls apart, nothing is founded either, and the
       population can only decline — so the spore the brief asked for is no
       longer optional. Rare enough that an arrival still reads as an event. */
    /* Optionally only the thriving get to throw one. Note which way this is
       expected to cut: fit is affinity against local ground, so the fittest
       nodes are those matched to the COMMONEST terrain, and the commonest
       terrain is the sea. Selecting spore parents by fit therefore flings sea
       specialists across the planet preferentially, which is the documented
       route to monoculture — the same homogenising the rate itself was cut to
       weaken. Measured rather than assumed, but that is the prior. */
    if(prnd() < PARAMS.spore && (PARAMS.sporefit<=0 || NFIT[best]>=PARAMS.sporefit)){
      spore(best); continue;
    }
    /* Retiring by index is only safe if that index still holds this node: the
       draws above may have swapped the array about while cleaning stale
       entries. If it has moved, leave it — the next draw that finds it full
       will drop it, which is the same lazy cleaning as everywhere else. */
    const stillThere = PFRONT[bestFi]===bestTag;
    if(bud(best)){
      budOk++; NTRY[best]=0;
      if(NKID[best] >= NCAP[best] && stillThere) retire(bestFi);
    } else {
      budNo++;
      if(tries>0 && ++NTRY[best] >= tries && stillThere) retire(bestFi);
    }
  }
}

function plantsSeed(){
  if(!plantsOn) return;
  /* Uniformly random genomes normalise to near-generalists, and a world of
     identical generalists gives selection nothing to work on. Tip each seed
     toward one of the five so there is variation on the board at tick zero. */
  for(let n=0, guard=0; n<PARAMS.seeds && guard<80000; guard++){
    const u=prnd()*2-1, ph=prnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    const x=r*Math.cos(ph), y=u, z=r*Math.sin(ph);
    let ax=-Math.sin(ph), ay=0, az=Math.cos(ph);
    const th=prnd()*Math.PI*2, cc=Math.cos(th), ss=Math.sin(th);
    const bx=y*az-z*ay, by=z*ax-x*az, bz=x*ay-y*ax;
    let hx=ax*cc+bx*ss, hy=ay*cc+by*ss, hz=az*cc+bz*ss;
    const dp=hx*x+hy*y+hz*z; hx-=x*dp; hy-=y*dp; hz-=z*dp;
    const l=1/Math.hypot(hx,hy,hz);
    const i = addNode(x,y,z,hx*l,hy*l,hz*l,-1,-1,0,PARAMS.step);
    const o = i*G, fav = (prnd()*5)|0;
    for(let g=0;g<5;g++) GENE[o+g] = 0.25+prnd()*0.5;
    GENE[o+fav] += 2.2+prnd()*1.6;
    normalise(o);
    /* the affinities were rewritten after the node was built, so everything the
       program read off them has to be taken again */
    if(refreshEnv(i) < PARAMS.viable){ killNode(i); continue; }
    readBirthOutputs(i);
    n++;
  }
  resetStats();   /* seeding is not a sample of what the world is doing */
}

/* ---- the scout-and-nursery test ----
   Two plants each internally uniform look identical, by every population
   statistic, to one plant carrying both kinds of node. Only the spread of pace
   and capacity *within* single bodies tells them apart, and the second is the
   thing this design exists to produce. Pooled within-body variance against the
   population's is the answer in one number: near zero and bodies are uniform
   and the formulas are only reading the genome, not the situation. */
const BN=new Int32Array(PMAX), BP=new Float32Array(PMAX), BP2=new Float32Array(PMAX);
const BC=new Float32Array(PMAX), BC2=new Float32Array(PMAX), BCM=new Uint8Array(PMAX);
const BFAN=new Float32Array(PMAX), BSTEP=new Float32Array(PMAX);
const BNICHE=new Uint8Array(PMAX);   // which environments a body is built for
const BAFF=new Float32Array(PMAX*5); // a body's average affinity, to test against
const POPPACE=new Int32Array(NBIN_H), POPSPRD=new Int32Array(NBIN_H);
const POPCAP=new Int32Array(10);
function withinBody(){
  BN.fill(0,0,nodeHigh); BP.fill(0,0,nodeHigh); BP2.fill(0,0,nodeHigh);
  BC.fill(0,0,nodeHigh); BC2.fill(0,0,nodeHigh); BCM.fill(0,0,nodeHigh);
  BFAN.fill(0,0,nodeHigh); BSTEP.fill(0,0,nodeHigh); BNICHE.fill(0,0,nodeHigh);
  BAFF.fill(0,0,nodeHigh*5);
  POPPACE.fill(0); POPSPRD.fill(0); POPCAP.fill(0);
  const slo=PARAMS.splo, srange=Math.max(1e-6,PARAMS.sphi-PARAMS.splo);
  let n=0, sp=0, sp2=0, sc=0, sc2=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    const r=PROOT[i], p=NPACE[i], c=NCAP[i];
    BN[r]++; BP[r]+=p; BP2[r]+=p*p; BC[r]+=c; BC2[r]+=c*c; BCM[r]|=(1<<c);
    BFAN[r]+=Math.abs(NANG[i]); BSTEP[r]+=NSTEP[i];
    /* which of the five *this node* leans toward, so that a body holding sea
       nodes and forest nodes can be told from a body of one mind. This is the
       whole point of letting a formula lean the affinities, and no population
       statistic can see it: a planet of single-minded plants spread across
       five environments scores identically to one where each plant spans two. */
    { const o=i*G; let mx=-1, at=0;
      for(let g=0;g<5;g++){ if(GENE[o+g]>mx){ mx=GENE[o+g]; at=g; } BAFF[r*5+g]+=GENE[o+g]; }
      BNICHE[r] |= (1<<at); }
    n++; sp+=p; sp2+=p*p; sc+=c; sc2+=c*c;
    POPCAP[c<10?c:9]++;
    let t=p; t=t<0?0:(t>0.99999?0.99999:t); POPPACE[(t*NBIN_H)|0]++;
    t=(NSTEP[i]/PARAMS.step-slo)/srange; t=t<0?0:(t>0.99999?0.99999:t); POPSPRD[(t*NBIN_H)|0]++;
  }
  /* pooled within-body sums of squares, over bodies big enough to have a shape */
  let wss=0, wdf=0, css=0, mixed=0, bodies=0, bestSD=0, bestN=0;
  for(let r=0;r<nodeHigh;r++){
    const nb=BN[r]; if(nb<2) continue;
    const ss = Math.max(0, BP2[r] - BP[r]*BP[r]/nb);
    wss+=ss; wdf+=nb-1;
    css+=Math.max(0, BC2[r] - BC[r]*BC[r]/nb);
    if(nb>=8){
      bodies++;
      let m=BCM[r], bits=0; while(m){ bits+=m&1; m>>=1; }
      if(bits>=2) mixed++;
      const sd=Math.sqrt(ss/(nb-1));
      if(sd>bestSD){ bestSD=sd; bestN=nb; }
    }
  }
  /* Do different plants have different *shapes*? Niche diversity says nothing
     about it — a planet of identically-shaped plants in five environments
     scores perfectly on evenness. Between-plant spread of the two things that
     decide form: how wide a node fans its children, and how far it puts them. */
  let bn=0, fs=0, fs2=0, ds=0, ds2=0, twoTerrain=0, nicheSpan=0;
  for(let r=0;r<nodeHigh;r++){
    if(BN[r]<8 || PROOT[r]!==r) continue;
    const mf=BFAN[r]/BN[r], md=BSTEP[r]/BN[r];
    bn++; fs+=mf; fs2+=mf*mf; ds+=md; ds2+=md*md;
    let m=BNICHE[r], nb=0; while(m){ nb+=m&1; m>>=1; }
    nicheSpan += nb; if(nb>=2) twoTerrain++;
  }
  const fanSD  = bn>1 ? Math.sqrt(Math.max(0, fs2/bn-(fs/bn)*(fs/bn))) : 0;
  const stepSD = bn>1 ? Math.sqrt(Math.max(0, ds2/bn-(ds/bn)*(ds/bn))) : 0;

  /* Is a node's own leaning actually *about* the ground it stands on, or is it
     just drift between sectors? A body of one mind would fit its ground exactly
     as well using its own average affinity everywhere. Score each node twice —
     once with its affinity, once with its body's mean — and the difference is
     how much the leaning is worth. Positive means the plants are reading the
     terrain, which is the claim; near zero would mean the spread across
     terrains is mutation wandering and nothing more. */
  let gain=0, gn=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    const r=PROOT[i], nb=BN[r];
    if(nb<8) continue;
    const e=i*5, b=r*5; let fb=0;
    for(let g=0;g<5;g++) fb += (BAFF[b+g]/nb)*NENV[e+g];
    gain += NFIT[i]-fb; gn++;
  }

  const pv = n>1 ? Math.max(0, sp2/n - (sp/n)*(sp/n)) : 0;
  const cv = n>1 ? Math.max(0, sc2/n - (sc/n)*(sc/n)) : 0;
  const wp = wdf>0 ? wss/wdf : 0, wc = wdf>0 ? css/wdf : 0;
  return {
    paceSD:+Math.sqrt(pv).toFixed(4), paceWithinSD:+Math.sqrt(wp).toFixed(4),
    paceWithinShare:+(pv>1e-9 ? wp/pv : 0).toFixed(3),
    capSD:+Math.sqrt(cv).toFixed(4), capWithinSD:+Math.sqrt(wc).toFixed(4),
    capWithinShare:+(cv>1e-9 ? wc/cv : 0).toFixed(3),
    /* the plainest version of the same question: how many bodies of any size
       hold more than one kind of node at all */
    bodies8:bodies, mixedCapBodies:+(bodies? mixed/bodies : 0).toFixed(3),
    widestBodySD:+bestSD.toFixed(4), widestBodyN:bestN,
    /* shape variety between plants, and the mean shape */
    /* the direct test of the thing affinity modulation exists for */
    twoTerrainBodies:+(bn?twoTerrain/bn:0).toFixed(3),
    leanGain:+(gn?gain/gn:0).toFixed(4), leanSampled:gn,
    terrainsPerBody:+(bn?nicheSpan/bn:0).toFixed(2),
    fanSD:+fanSD.toFixed(3), stepSD:+stepSD.toFixed(4),
    meanFan:+(bn?fs/bn:0).toFixed(3), meanStep:+(bn?ds/bn:0).toFixed(4),
    meanPace:+(n?sp/n:0).toFixed(3), meanCap:+(n?sc/n:0).toFixed(3),
    capShare:Array.from(POPCAP.subarray(1)).map(v=>+(v/Math.max(1,n)).toFixed(3))
  };
}

function plantStats(reset){
  const per=[0,0,0,0,0]; let spec=0;
  for(let i=0;i<nodeHigh;i++){
    if(NLIVE[i]!==1) continue;
    const o=i*G; let mx=0, at=0;
    for(let g=0;g<5;g++) if(GENE[o+g]>mx){ mx=GENE[o+g]; at=g; }
    per[at]++; spec+=(mx-1)/4;
  }
  /* how much of a program actually reaches an output. One means nothing is
     being computed, however long the list is */
  let act=0, actN=0, actMin=1e9, actMax=0, badGene=0, badK=0;
  for(let i=0;i<nodeHigh;i+=53){
    if(NLIVE[i]!==1) continue;
    const a=activeCount(i); act+=a; actN++;
    if(a<actMin) actMin=a; if(a>actMax) actMax=a;
    for(let g=0;g<G;g++) if(!isFinite(GENE[i*G+g])) badGene++;
    for(let g=0;g<NK;g++) if(!isFinite(KONST[i*NK+g])) badK++;
  }
  const outs={};
  for(let j=0;j<NOUT;j++){
    const q=quantiles(j);
    outs[OUTNAME[j]]={ min:+(OUTMIN[j]===Infinity?0:OUTMIN[j]).toFixed(3),
                       q1:q.q1, med:q.med, q3:q.q3,
                       max:+(OUTMAX[j]===-Infinity?0:OUTMAX[j]).toFixed(3),
                       peakShare:q.peak,
                       meanRawMag:+(OUTRAW[j]/Math.max(1,outN)).toFixed(2) };
  }
  /* The branching test. A node that gives every child the same heading makes a
     spike; one that differentiates them makes a tree. Nothing in the output
     distributions can tell those apart. */
  outs.angle.spreadWithinNode = +(angDiffSum/Math.max(1,angDiffN)).toFixed(3);
  outs.angle.siblingsCompared = angDiffN;
  outs.angle.reads = angN;
  const hgtStat = { tried:hgtTried, done:hgtDone,
                    tookShare:+(hgtDone/Math.max(1,hgtTried)).toFixed(3) };
  const ins={};
  for(let j=0;j<NIN;j++){
    const m=INSUM[j]/Math.max(1,inN);
    ins[INNAME[j]]={ mean:+m.toFixed(3),
                     sd:+Math.sqrt(Math.max(0,INSUM2[j]/Math.max(1,inN)-m*m)).toFixed(3),
                     min:+(INMIN[j]===Infinity?0:INMIN[j]).toFixed(2),
                     max:+(INMAX[j]===-Infinity?0:INMAX[j]).toFixed(2) };
  }
  const out = {
    live:liveN, wood:woodN, slots:nodeHigh, deaths, bodies:comps,
    meanBody:+meanComp.toFixed(1), largestBody:bigFrag, frontier:frontN, tick:ptick,
    /* expected to stay at zero, and checked rather than assumed */
    nonFinite:progNonFinite, progRuns, badGenes:badGene, badKonst:badK, nanFits:dbgNaN,
    outputs:outs, births:outN, transfer:hgtStat,
    capBirthShare:Array.from(CAPHIST.subarray(1)).map(v=>+(v/Math.max(1,outN)).toFixed(3)),
    active:{ mean:+(act/Math.max(1,actN)).toFixed(1),
             min:actN?actMin:0, max:actMax, of:PLEN, sampled:actN },
    inputs:ins,
    body:withinBody(),
    /* where the growth loop's draws went, which is the open question about
       whether the eligible set is small enough to draw from uniformly */
    draws:{ eligible:frontDraw, dropped:frontDrop, immature:frontYoung,
            budOk, budBlocked:budNo,
            eligibleShare:+(frontDraw/Math.max(1,frontDraw+frontDrop)).toFixed(3),
            matureShare:+((frontDraw-frontYoung)/Math.max(1,frontDraw)).toFixed(3),
            budShare:+(budOk/Math.max(1,budOk+budNo)).toFixed(3) },
    meanFit:+(dbgFit/Math.max(1,dbgFitOk)).toFixed(3),
    /* meanFit above is a lifetime average — nothing resets these counters — so
       a reading taken at the end of a long run is diluted by the whole run and
       a late collapse barely moves it. The raw pair is exposed so two readings
       can be differenced into the mean over the interval between them, which
       is what a sweep comparing end-state against mid-state actually needs. */
    fitSum:+dbgFit.toFixed(2), fitN:dbgFitOk,
    meanLifeSet:+(dbgLife/Math.max(1,dbgHits)).toFixed(0),
    hitFloor:dbgFloor, ageDeaths:dbgAgeDeaths,
    strategies:Array.from(CENSUS).filter(v=>v>0).length,
    topStrategy:+(Math.max(...CENSUS)/Math.max(1,censusN)).toFixed(3),
    /* the census in full, not just its width and its peak. Two readings of it
       difference into how much of the population changed strategy between
       them, which is the only way to tell a world that is holding its
       diversity from one that has simply stopped moving. */
    census:Array.from(CENSUS),
    specialisation:+(spec/Math.max(1,liveN)).toFixed(3),
    niche:{sea:per[0], ice:per[1], desert:per[2], grass:per[3], forest:per[4]}
  };
  if(reset){ resetStats(); frontDraw=frontDrop=frontYoung=budOk=budNo=0;
             hgtTried=hgtDone=0; }
  return out;
}

/* An algorithm can be printed, which a neural net cannot, and that is half the
   reason for choosing this representation. Inactive instructions are marked
   rather than hidden: they are the neutral reservoir mutation draws on. */
function genomeText(i){
  if(i==null){
    for(let n=0;n<nodeHigh;n++) if(NLIVE[n]===1 && PROOT[n]===n){ i=n; break; }
    if(i==null) for(let n=0;n<nodeHigh;n++) if(NLIVE[n]===1){ i=n; break; }
  }
  if(i==null) return "no live nodes";
  activeCount(i);
  const nm=a=> a<NIN ? INNAME[a]
            : a<NIN+NK ? "k"+(a-NIN)+"="+KONST[i*NK+(a-NIN)].toFixed(2)
            : "r"+(a-NIN-NK);
  const L=[];
  for(let j=0;j<PLEN;j++){
    const q=(i*PLEN+j)*4, op=PROG[q], ar=ARITY[op];
    const args=[]; for(let t=1;t<=ar;t++) args.push(nm(PROG[q+t]));
    L.push((AMARK[j]?"  ":"· ")+"r"+j+" = "+OPNAME[op]+"("+args.join(", ")+")");
  }
  for(let j=0;j<NOUT;j++) L.push("  "+OUTNAME[j]+" <- "+nm(POUT[i*NOUT+j]));
  L.push("  affinity ["+Array.from(GENE.subarray(i*G,i*G+5)).map(v=>v.toFixed(2)).join(" ")+"]");
  L.push("  built: capacity "+NCAP[i]+"  turn "+NANG[i].toFixed(2)+
         "  pace "+NPACE[i].toFixed(2)+"  depth "+NDEP[i]);
  return L.join("\n");
}

const canvas=document.getElementById("gl");

if(!gl){ document.getElementById("fail").style.display="flex";
         document.getElementById("splash").style.display="none"; return; }

function sh(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s)+"\n"+src.split("\n").map((l,i)=>(i+1)+": "+l).join("\n"));
  return s;
}
function prog(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name.replace("[0]","");
    u[nm]=gl.getUniformLocation(p,nm); }
  p.u=u; return p;
}

const GLSL_NOISE = `
vec3 hash33(vec3 p){
  p = fract(p*vec3(0.1031,0.1030,0.0973));
  p += dot(p, p.yxz+33.33);
  vec3 g = fract((p.xxy+p.yxx)*p.zyx)*2.0-1.0;
  /* unit-length gradients: without this the cube diagonals dominate and
     the noise shows a herringbone lattice */
  return g*inversesqrt(dot(g,g)+1e-5);
}
vec3 hash33r(vec3 p){
  p = fract(p*vec3(0.1031,0.1030,0.0973));
  p += dot(p, p.yxz+33.33);
  return fract((p.xxy+p.yxx)*p.zyx);
}
float gnoise(vec3 p){
  vec3 i=floor(p), f=fract(p);
  vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash33(i+vec3(0,0,0)),f-vec3(0,0,0)),
                     dot(hash33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash33(i+vec3(0,1,0)),f-vec3(0,1,0)),
                     dot(hash33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash33(i+vec3(0,0,1)),f-vec3(0,0,1)),
                     dot(hash33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash33(i+vec3(0,1,1)),f-vec3(0,1,1)),
                     dot(hash33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z)*1.32;
}
/* rotate between octaves so the lattices never line up */
const mat3 NR = mat3( 0.00, 0.80, 0.60, -0.80, 0.36,-0.48, -0.60,-0.48, 0.64);
float fbm2(vec3 p){
  float s=0.6667*gnoise(p); p=NR*p*2.07+11.1;
  return s+0.3333*gnoise(p);
}
float fbm3(vec3 p){
  float s=0.5333*gnoise(p); p=NR*p*2.03+11.1;
  s+=0.2667*gnoise(p);      p=NR*p*2.11-7.3;
  return s+0.1333*gnoise(p);
}
float fbm5(vec3 p){
  float a=0.5,s=0.0;
  for(int i=0;i<5;i++){ s+=a*gnoise(p); p=NR*p*2.04+vec3(5.2,1.3,9.7); a*=0.5; }
  return s;
}`;

/* ---------- sphere geometry ---------- */
function makeSphere(seg,rings){
  const pos=[],idx=[];
  for(let j=0;j<=rings;j++){
    const v=j/rings, th=v*Math.PI, st=Math.sin(th), ct=Math.cos(th);
    for(let i=0;i<=seg;i++){
      const u=i/seg, ph=u*Math.PI*2;
      pos.push(st*Math.cos(ph), ct, st*Math.sin(ph));
    }
  }
  /* counter-clockwise when seen from outside the sphere */
  for(let j=0;j<rings;j++)for(let i=0;i<seg;i++){
    const a=j*(seg+1)+i, b=a+seg+1;
    idx.push(a,a+1,b, b,a+1,b+1);
  }
  return {pos:new Float32Array(pos), idx:new Uint32Array(idx)};
}

/* ---------- ring geometry ----------
   Held in tight against the planet the ring reads as small, because this world
   already looks Earth-sized and a close ring borrows that scale. Standing it
   further off buys back the sense that both are enormous. It costs framing:
   fitDist puts the edge of a square window at about 1.3 radii, so seen exactly
   edge-on in a narrow window the ring can fall outside the picture entirely.
   Worth it — in any ordinary landscape window it is all there, and the shape
   is what sells the size. The mesh is only a proxy for the rasteriser:
   every fragment works out its own radius from the view ray, so neither these
   radii nor the thickness the vertex shader gives it ever show in the picture.
   What they do decide is where fragments get generated at all. */
const RING_R0 = 1.36, RING_R1 = 2.18;
function makeRing(seg, r0, r1){
  /* a frame spanning the ring plane; any pair perpendicular to the axis does */
  const U = (()=>{ const a = Math.abs(POLE[1])<0.9 ? [0,1,0] : [1,0,0];
    const c = [POLE[1]*a[2]-POLE[2]*a[1], POLE[2]*a[0]-POLE[0]*a[2], POLE[0]*a[1]-POLE[1]*a[0]];
    const l = 1/Math.hypot(c[0],c[1],c[2]); return [c[0]*l,c[1]*l,c[2]*l]; })();
  const W = [POLE[1]*U[2]-POLE[2]*U[1], POLE[2]*U[0]-POLE[0]*U[2], POLE[0]*U[1]-POLE[1]*U[0]];
  const pos=[], side=[], idx=[];
  /* four rings of vertices: inner and outer, each on both faces of the slab */
  for(const rs of [[r0,1],[r1,1],[r0,-1],[r1,-1]]){
    for(let i=0;i<=seg;i++){
      const th=i/seg*Math.PI*2, c=Math.cos(th), s=Math.sin(th);
      pos.push((U[0]*c+W[0]*s)*rs[0], (U[1]*c+W[1]*s)*rs[0], (U[2]*c+W[2]*s)*rs[0]);
      side.push(rs[1]);
    }
  }
  const N=seg+1;
  /* counter-clockwise seen from outside each of the four faces, or back-face
     culling renders the far side of the slab and the shading doubles up */
  for(let i=0;i<seg;i++){
    const it=i, ot=N+i, ib=2*N+i, ob=3*N+i;
    idx.push(it, ot, ot+1,   it, ot+1, it+1);      // face toward the north pole
    idx.push(ib, ib+1, ob+1, ib, ob+1, ob);        // face toward the south pole
    idx.push(ot, ob, ob+1,   ot, ob+1, ot+1);      // outer rim
    idx.push(it, ib+1, ib,   it, it+1, ib+1);      // inner rim
  }
  return {pos:new Float32Array(pos), side:new Float32Array(side), idx:new Uint32Array(idx)};
}
const RING = makeRing(256, RING_R0, RING_R1);

/* ---------- plant sheet ----------
   Plants are drawn into an equirectangular sheet the planet shader folds into
   its albedo before any lighting, so they are shaded, cut by the terminator
   and hazed by the atmosphere exactly as the ground is, for nothing. The sheet
   is rebuilt from the live nodes rather than accumulated, because a node that
   dies has to stop being drawn and blended paint cannot be taken back. */
const plantTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,plantTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,PW,PH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

const plantFBO=gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER,plantFBO);
gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,plantTex,0);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);

const plantProg = prog(`#version 300 es
layout(location=0) in vec2 aCorner;   /* the quad */
layout(location=1) in vec2 aUV;       /* where the node sits on the sheet */
layout(location=2) in vec2 aSize;     /* along the branch, and across it */
layout(location=3) in float aRot;
layout(location=4) in vec4 aCol;
uniform float uSeam;
/* (u0, v0, du, dv) of the patch being drawn into. The whole sheet is
   (0,0,1,1); a detail window is a small box, and the same quads land in it
   magnified. */
uniform vec4 uWin;
/* The detail patch is a *tangent plane* centred on wherever the camera is
   looking, not a lat/lon box. A box cannot describe the region round a pole —
   every longitude converges there, so it either fails to cover the screen or
   has to span the whole planet — and that is why the poles came out half sharp
   and half not. A gnomonic patch has no poles and wastes no texels. */
uniform mat3 uFrame;      /* right, up, forward */
uniform float uSpan;      /* tan of the patch's half-angle */
uniform float uTan;       /* 1 = patch, 0 = the equirectangular sheet */
out vec2 vC; out vec4 vCol;
void main(){
  float lat = (0.5 - aUV.y)*3.14159265;
  /* The footprint is a circle of arc on the globe, so longitude has to be
     widened by 1/cos(lat) to hold it. Unbounded, that factor runs away at the
     pole: every node there paints a band across all longitudes, and the poles
     pucker into a starburst — the single thing in the picture that shouts
     "generated". Bound the widening, and fade the last few degrees rather than
     let them thin into gaps. Under one percent of the globe is lost, and the
     terrain underneath was never the problem. */
  float cl  = max(cos(lat), 0.13);
  float ca=cos(aRot), sa=sin(aRot);
  vec2 e = aCorner*aSize;
  vec2 arc = vec2(e.x*ca - e.y*sa, e.x*sa + e.y*ca);
  float u = aUV.x + arc.x/(6.2831853*cl) + uSeam;
  float v = aUV.y - arc.y/3.14159265;
  /* ascending, always — a descending smoothstep is undefined */
  float polar = 1.0 - smoothstep(0.978, 0.9976, abs(sin(lat)));
  vC = aCorner; vCol = vec4(aCol.rgb, aCol.a*polar);
  if(uTan > 0.5){
    float lon2 = aUV.x*6.2831853 - 3.14159265;
    float sn2 = sin(lon2), cs2 = cos(lon2), cl2 = cos(lat), sl2 = sin(lat);
    vec3 dir  = vec3(cl2*cs2, sl2, cl2*sn2);
    vec3 east = vec3(-sn2, 0.0, cs2);
    vec3 nrt  = cross(east, dir);
    /* Cull on the *node*, never on the corner. A quad has four vertices and
       one node; testing each vertex meant a node near the projection's horizon
       could have three corners project normally and the fourth thrown to
       infinity, which stretches the quad into a streak clear across the
       screen. With a quarter of a million instances a great many sit near that
       line at any moment, and they sweep as the view turns — bands, moving.
       Testing the centre makes a quad wholly in or wholly out, and the cut is
       set well outside the patch so nothing visible is ever dropped. */
    float cz = dot(dir, uFrame[2]);
    if(cz <= 0.30){ gl_Position = vec4(4.0, 4.0, 0.0, 1.0); return; }
    vec3 pp = normalize(dir + east*arc.x + nrt*arc.y);
    float fz = max(0.30, dot(pp, uFrame[2]));
    gl_Position = vec4(dot(pp,uFrame[0])/(fz*uSpan),
                       dot(pp,uFrame[1])/(fz*uSpan), 0.0, 1.0);
    return;
  }
  gl_Position = vec4(((u - uWin.x)/uWin.z)*2.0-1.0,
                     ((v - uWin.y)/uWin.w)*2.0-1.0, 0.0, 1.0);
}`, `#version 300 es
precision highp float;
in vec2 vC; in vec4 vCol;
uniform float uSoft;
out vec4 o;
void main(){
  float q = length(vC);
  /* ascending, always: a descending smoothstep is undefined and vanishes on
     some drivers */
  float a;
  if(vCol.a < 0.0){
    /* a marker ring: a band just inside the quad, soft on both sides */
    a = smoothstep(0.74, 0.87, q)*(1.0 - smoothstep(0.90, 1.0, q))*(-vCol.a);
  } else {
    a = (1.0 - smoothstep(1.0-uSoft, 1.0, q))*vCol.a;
  }
  if(a <= 0.004) discard;
  o = vec4(vCol.rgb, a);
}`);

/* ---- the detail window ----
   The sheet above covers the whole planet in 2048 pixels, so a node is under
   two of them and zooming in only magnifies the blur. Raising the sheet is the
   obvious answer and a poor one: four times the memory and four times the
   mipmap cost every tick buys a node 3.6 pixels instead of 1.8, which is still
   nothing. Instead, when the camera comes close, the same quads are drawn a
   second time into a texture covering only the patch you can actually see.
   Detail then scales with how far you zoom, and costs nothing when zoomed out. */
const DW = 2048;
const detailTex = gl.createTexture();

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const detailFBO = gl.createFramebuffer();

gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,detailTex,0);

const DFRAME = new Float32Array(9);   /* right, up, forward — column major */
let detailSpan = 1, detailOn = 0;

const plantVAO=gl.createVertexArray();
gl.bindVertexArray(plantVAO);
const quadVBO=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quadVBO);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const instVBO=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,instVBO);
gl.bufferData(gl.ARRAY_BUFFER,MAXINST*INST*4,gl.DYNAMIC_DRAW);
const STRIDE=INST*4;
[[1,2,0],[2,2,8],[3,1,16],[4,4,20]].forEach(a=>{
  gl.enableVertexAttribArray(a[0]);
  gl.vertexAttribPointer(a[0],a[1],gl.FLOAT,false,STRIDE,a[2]);

/* the same instances again, into the visible patch only */
function renderDetail(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, detailFBO);
  gl.viewport(0,0,DW,DW);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if(instN>0){
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(plantProg);
    /* A crisper edge here, and it is not a different look: the softness is
       measured across the quad, so magnifying a node fifty times magnifies its
       gradient with it. Holding `soft` constant would make the detail patch
       blurrier than the sheet it replaces, which is the opposite of the point. */
    gl.uniform1f(plantProg.u.uSoft, Math.max(0.02,PARAMS.soft*0.45));
    gl.uniformMatrix3fv(plantProg.u.uFrame, false, DFRAME);
    gl.uniform1f(plantProg.u.uSpan, detailSpan);
    gl.uniform1f(plantProg.u.uTan, 1);
    gl.uniform1f(plantProg.u.uSeam, 0);      /* a patch has no seam to cross */
    gl.bindVertexArray(plantVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,instN);
    gl.bindVertexArray(null);
    gl.uniform1f(plantProg.u.uTan, 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

function renderPlants(){
  /* Two different clocks. The planet-wide sheet only changes when the
     simulation does; the detail patch has to follow the camera, but it can
     reuse the instances already uploaded — no rebuild, no mipmap. Redrawing
     both together every frame was costing a full 240,000-instance rebuild and
     a mipmap per frame for a window that had merely panned. */
  if(detailOn > 0.002) renderDetail();
  if(!plantsDirty) return;
  plantsDirty=false;
  buildInstances();
  gl.bindBuffer(gl.ARRAY_BUFFER,instVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,IBUF,0,instN*INST);
  gl.bindFramebuffer(gl.FRAMEBUFFER,plantFBO);
  gl.viewport(0,0,PW,PH);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if(instN>0){
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(plantProg);
    gl.uniform1f(plantProg.u.uSoft, Math.max(0.02,PARAMS.soft));
    gl.bindVertexArray(plantVAO);
    /* three passes a turn apart, so a footprint straddling the back meridian
       is drawn on both sides of it instead of being torn in half */
    gl.uniform4f(plantProg.u.uWin, 0,0,1,1);
    gl.uniform1f(plantProg.u.uTan, 0);
    for(const off of [-1,0,1]){
      gl.uniform1f(plantProg.u.uSeam, off);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,instN);
    }
    gl.bindVertexArray(null);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.bindTexture(gl.TEXTURE_2D,plantTex);
  gl.generateMipmap(gl.TEXTURE_2D);
  /* the frame loop sets its own viewport before it draws anything */
}

void main(){

const bakeProg = prog(VS_QUAD, `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;
${GLSL_NOISE}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  float lon = (uv.x-0.5)*6.28318530718;
